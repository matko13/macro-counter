<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Licznik Makro</title>
<meta name="description" content="Prosty licznik kalorii i makro — dodajesz jedzenie jednym tapnięciem, bez wpisywania.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14150F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Makro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500..700&display=swap">
<style>
/* ─────────── tokens: light is the base, both dark states redefine only these ─────────── */
:root{
  --ground:#E7E6DD; --surface:#F6F5F0; --sunken:#EFEEE6; --raised:#FFFFFF;
  --ink:#191B12; --ink-2:#585B4B; --ink-3:#8A8D7B; --line:#DCDBCE; --line-2:#C9C8B8;
  --p:#04795B; --c:#B5761B; --f:#6B4C9A;
  --accent:#04795B; --accent-ink:#FFFFFF; --accent-soft:#DDEAE4;
  --over:#D03B3B; --over-soft:#F7E3E1;
  --shadow:0 1px 2px rgba(25,27,18,.06), 0 8px 24px -12px rgba(25,27,18,.18);
  --r:14px; --r-sm:9px; --r-lg:20px;
  --tap:46px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B0C07; --surface:#14150F; --sunken:#1C1E15; --raised:#22241A;
    --ink:#F2F1E6; --ink-2:#B1B4A1; --ink-3:#7E8171; --line:#2B2D22; --line-2:#3B3E30;
    --p:#22997A; --c:#B8862A; --f:#8A6FC2;
    --accent:#22997A; --accent-ink:#08110D; --accent-soft:#1B2A23;
    --over:#D03B3B; --over-soft:#2E1A18;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0B0C07; --surface:#14150F; --sunken:#1C1E15; --raised:#22241A;
  --ink:#F2F1E6; --ink-2:#B1B4A1; --ink-3:#7E8171; --line:#2B2D22; --line-2:#3B3E30;
  --p:#22997A; --c:#B8862A; --f:#8A6FC2;
  --accent:#22997A; --accent-ink:#08110D; --accent-soft:#1B2A23;
  --over:#D03B3B; --over-soft:#2E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-family:Fraunces,Georgia,serif;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ─────────── shell: a paper strip on the counter ─────────── */
.app{
  max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--surface);position:relative;
  display:flex;flex-direction:column;
  box-shadow:0 0 0 1px var(--line), 0 0 60px -20px rgba(0,0,0,.25);
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;background:var(--surface);
}
.brand{display:flex;align-items:baseline;gap:7px}
.brand b{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:19px;letter-spacing:-.015em}
.brand span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.iconbtn{
  width:38px;height:38px;display:grid;place-items:center;border-radius:11px;
  color:var(--ink-2);border:1px solid transparent;
}
.iconbtn:hover{background:var(--sunken);color:var(--ink)}
main{flex:1;padding:16px 16px 26px;display:flex;flex-direction:column;gap:22px}

/* ─────────── bottom tabs ─────────── */
.tabs{
  position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;
  color:var(--ink-3);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:500;
}
.tab svg{width:21px;height:21px;stroke-width:1.7}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.1}

/* ─────────── date shuttle ─────────── */
.shuttle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shuttle h2{font-size:22px}
.shuttle .dow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-family:Archivo,sans-serif;font-weight:500}
.nav{display:flex;gap:4px}
.nav button{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;color:var(--ink-2)}
.nav button:hover:not(:disabled){background:var(--sunken);color:var(--ink)}
.nav button:disabled{opacity:.32;cursor:default}

/* ─────────── the scale readout ─────────── */
.readout{display:flex;flex-direction:column;gap:12px}
.bignum{display:flex;align-items:flex-end;gap:9px;line-height:.9}
.bignum .v{font-size:56px;font-weight:600;letter-spacing:-.035em}
.bignum .u{font-size:14px;font-weight:500;color:var(--ink-2);padding-bottom:6px}
.bignum .cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding-bottom:8px;margin-left:auto;font-weight:500}
.readout.over .bignum .v{color:var(--over)}
.sub{font-size:13px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap}
.sub b{font-weight:600;color:var(--ink)}

.gauge{position:relative;height:14px;background:var(--sunken);border-radius:7px;overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:7px;transition:width .35s cubic-bezier(.2,.7,.3,1)}
.gauge.over .fill{background:var(--over)}
.gauge .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--surface);opacity:.75}
.gauge .needle{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--surface);transition:left .35s cubic-bezier(.2,.7,.3,1)}

/* ─────────── macro bars ─────────── */
.macros{display:flex;flex-direction:column;gap:11px}
.macro{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.macro .k{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.macro .dot{width:9px;height:9px;border-radius:3px;background:var(--hue);flex:none}
.macro .v{font-size:13px;color:var(--ink-2)}
.macro .v b{color:var(--ink);font-weight:600}
.macro .track{grid-column:1/-1;height:8px;background:var(--sunken);border-radius:4px;overflow:hidden;display:flex}
.macro .bar{background:var(--hue);border-radius:4px;transition:width .35s cubic-bezier(.2,.7,.3,1)}
.macro .bar.spill{background:var(--over);margin-left:2px}

/* ─────────── section furniture ─────────── */
.sec{display:flex;flex-direction:column;gap:11px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sechead h3{font-size:15px}
.sechead .act{font-size:12px;font-weight:600;color:var(--accent)}
.eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* ─────────── 7-day strip ─────────── */
.week{position:relative;padding-top:14px}
.week .band{position:absolute;left:0;right:0;top:14px;height:62px;pointer-events:none}
.week .base{position:absolute;left:0;right:0;bottom:0;border-bottom:1px solid var(--line)}
.week .goal{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line-2)}
.week .goal span{position:absolute;right:0;top:-14px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.week .cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:block;border-radius:5px;padding:0}
.day .plot{display:block;position:relative;height:62px}
.day .bar{position:absolute;left:0;right:0;bottom:0;display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s ease}
.day.over .bar{background:var(--over)}
.day.nodata .bar{background:var(--line)}
.day .lbl{display:block;margin-top:5px;font-size:10px;line-height:1.45;text-align:center;color:var(--ink-3);letter-spacing:.04em}
.day.now .lbl{color:var(--ink);font-weight:700}
.day.now .bar{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ink)}
.weekwrap{padding-bottom:2px}
.wkfoot{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:9px}

/* ─────────── quick chips ─────────── */
.scroller{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:flex;flex-direction:column;gap:2px;padding:9px 13px;min-width:104px;
  background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);
}
.chip:hover{border-color:var(--line-2);background:var(--raised)}
.chip .n{font-size:13px;font-weight:500;line-height:1.25}
.chip .m{font-size:11px;color:var(--ink-3)}
.chip.ghost{background:transparent;border-style:dashed;justify-content:center;align-items:center;min-width:auto;padding:9px 15px}
.chip.ghost .n{color:var(--accent);font-weight:600}

/* ─────────── entry list ─────────── */
.group{display:flex;flex-direction:column;gap:2px}
.grouphead{display:flex;align-items:center;gap:9px;padding:6px 0 5px}
.grouphead .t{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.grouphead .k{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.grouphead .save{font-size:11px;font-weight:600;color:var(--accent);padding:2px 6px;border-radius:6px}
.entry{display:flex;align-items:center;gap:11px;width:100%;padding:10px 2px;border-bottom:1px solid var(--line);min-height:var(--tap)}
.entry:last-child{border-bottom:0}
.entry:hover{background:var(--sunken)}
.entry .n{flex:1;min-width:0}
.entry .n b{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .n s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-3)}
.entry .kc{font-size:14px;font-weight:600;flex:none}
.entry .kc s{text-decoration:none;font-size:10.5px;color:var(--ink-3);font-weight:500;margin-left:2px}
.macrodots{display:flex;gap:5px;font-size:10.5px;color:var(--ink-3)}
.macrodots i{font-style:normal}

/* ─────────── add view ─────────── */
.search{position:relative}
.search input{
  width:100%;padding:12px 38px 12px 38px;border:1px solid var(--line-2);border-radius:12px;
  background:var(--sunken);font-size:15px;
}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;color:var(--ink-3);border-radius:8px}
.cats{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:500}
.food{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:0}
.food .body{flex:1;min-width:0;padding:11px 0;min-height:var(--tap)}
.food:hover{background:var(--sunken)}
.food .body b{display:block;font-weight:500;font-size:14.5px}
.food .body s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-3)}
.addbtn{
  flex:none;display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:10px;
  background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600;
  min-height:38px;
}
.addbtn:hover{background:var(--accent);color:var(--accent-ink)}
.addbtn svg{width:14px;height:14px;stroke-width:2.6}
.empty{padding:26px 8px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* ─────────── forms / settings ─────────── */
.card{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;display:flex;flex-direction:column;gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
.field textarea{font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:96px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{padding:8px 12px;border:1px solid var(--line-2);border-radius:9px;font-size:13px;background:var(--surface);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:500}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:10px;font-size:19px;background:var(--surface)}
.stepper button:hover{background:var(--raised)}
.stepper .val{flex:1;text-align:center;font-size:19px;font-weight:600}
.stepper .val s{text-decoration:none;font-size:12px;color:var(--ink-3);font-weight:500;margin-left:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;min-height:var(--tap)}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--sunken);color:var(--ink);border:1px solid var(--line-2)}
.btn.danger{background:transparent;color:var(--over);border:1px solid var(--over)}
.note{font-size:12px;color:var(--ink-3);line-height:1.5}

/* ─────────── bottom sheet ─────────── */
.scrim{position:fixed;inset:0;background:rgba(10,11,7,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:460px;margin:0 auto;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:var(--shadow);padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .26s cubic-bezier(.2,.8,.25,1);
  max-height:88vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 12px}
.sheet h3{font-size:19px;margin-bottom:2px}
.sheet .per{font-size:12px;color:var(--ink-3);margin-bottom:14px}
.sheet .seg{margin-bottom:15px}
.sheet .field+.field{margin-top:13px}
.preview{display:flex;align-items:baseline;gap:8px;padding:12px 0 2px}
.preview .v{font-size:34px;font-weight:600;letter-spacing:-.03em}
.preview .u{font-size:12px;color:var(--ink-2)}
.pvmac{display:flex;gap:12px;font-size:12px;color:var(--ink-2);padding-bottom:14px}
.pvmac i{font-style:normal;font-weight:600;color:var(--ink)}
.sheetrow{display:flex;gap:8px;padding-top:12px}
.sheetrow .btn{flex:1}

/* ─────────── toast ─────────── */
.toast{
  position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:50;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--surface);padding:10px 10px 10px 15px;border-radius:12px;
  font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;
}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-weight:700;font-size:13px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.16);color:inherit}

/* ─────────── opis posiłku zdaniem ─────────── */
.nlcard{background:var(--accent-soft);border-radius:var(--r-lg);padding:13px 14px;display:flex;align-items:center;gap:12px;width:100%}
.nlcard:hover{filter:brightness(.97)}
.nlcard .ic{flex:none;width:34px;height:34px;border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.nlcard .ic svg{width:18px;height:18px}
.nlcard .tx b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.nlcard .tx s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-2);line-height:1.35}
.nlrow{display:grid;grid-template-columns:1fr auto auto;gap:3px 9px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.nlrow .n{grid-column:1;min-width:0}
.nlrow .n b{display:block;font-size:14.5px;font-weight:500}
.nlrow .n s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-3)}
.nlrow .kc{grid-column:2;font-size:14px;font-weight:600}
.nlrow .rm{grid-column:3;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--ink-3)}
.nlrow .rm:hover{background:var(--sunken);color:var(--over)}
.nlrow .rm svg{width:14px;height:14px}
.nlrow .warn{grid-column:1/-1;display:flex;align-items:flex-start;gap:6px;font-size:11.5px;color:var(--over);line-height:1.4;padding-top:4px}
.nlrow .warn svg{width:13px;height:13px;flex:none;margin-top:2px}
.nlrow .warn button{color:var(--over);font-weight:700;text-decoration:underline;font-size:11.5px}
.nlrow .g{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding-top:4px}
.nlrow .g button{width:30px;height:30px;flex:none;border:1px solid var(--line-2);border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--surface)}
.nlrow .g .v{min-width:60px;text-align:center;font-size:13.5px;font-weight:600}
.nltot{display:flex;align-items:baseline;gap:9px;padding:16px 0 3px}
.nltot .v{font-size:32px;font-weight:600;letter-spacing:-.03em}
.nltot .u{font-size:12px;color:var(--ink-2)}
.toggle{display:flex;align-items:center;gap:10px;padding:11px 0;width:100%;border-top:1px solid var(--line)}
.toggle .box{flex:none;width:22px;height:22px;border:1.5px solid var(--line-2);border-radius:7px;display:grid;place-items:center;color:transparent}
.toggle[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toggle .box svg{width:13px;height:13px;stroke-width:3}
.toggle .lb{font-size:13.5px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><b>Makro</b><span id="brandSub">licznik</span></div>
    <button class="iconbtn" id="themeBtn" title="Motyw" aria-label="Zmień motyw">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" width="20" height="20"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>

function norm(s){
  return String(s).toLowerCase()
    .replace(/ł/g,"l").replace(/Ł/g,"l")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function n0(x){return Math.round(x)}
function fmt(x){return n0(x).toLocaleString("pl-PL")}
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseKey(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function shiftKey(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)}
var DOW=["niedziela","poniedziałek","wtorek","środa","czwartek","piątek","sobota"];
var DOW1=["N","Pn","Wt","Śr","Cz","Pt","So"];
var MON=["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
function dayTitle(k){
  var t=dkey(new Date());
  if(k===t)return "Dziś";
  if(k===shiftKey(t,-1))return "Wczoraj";
  if(k===shiftKey(t,1))return "Jutro";
  var d=parseKey(k);return d.getDate()+" "+MON[d.getMonth()];
}
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)for(var a in attrs){
    if(a==="class")e.className=attrs[a];
    else if(a==="html")e.innerHTML=attrs[a];
    else if(a==="text")e.textContent=attrs[a];
    else if(a.slice(0,2)==="on")e.addEventListener(a.slice(2),attrs[a]);
    else if(a.slice(0,2)==="--")e.style.setProperty(a,attrs[a]);
    else if(attrs[a]!=null)e.setAttribute(a,attrs[a]);
  }
  (kids||[]).forEach(function(k){if(k)e.appendChild(k)});
  return e;
}
function svg(d,extra){

}

var day=dkey(new Date());

function entries(k){return S.log[k]||[]}
function totals(k){
  var t={k:0,p:0,c:0,f:0};
  entries(k).forEach(function(e){t.k+=e.k;t.p+=e.p;t.c+=e.c;t.f+=e.f});
  return t;
}
function scale(food,g){
  var r=g/100;
  return {k:food.k*r,p:food.p*r,c:food.c*r,f:food.f*r};
}
var SLOTS=["Śniadanie","Obiad","Kolacja","Przekąska"];
function slot(ts){
  var h=new Date(ts).getHours();
  if(h>=4&&h<11)return "Śniadanie";
  if(h>=11&&h<16)return "Obiad";
  if(h>=16&&h<21)return "Kolacja";
  return "Przekąska";
}
/* posiłek podany wprost ("na śniadanie") bije zgadywanie z godziny */
function slotOf(e){return e.sl||slot(e.t)}
function pieceWeight(food){return food.pc||food.s}
function bump(id){var u=S.usage[id]||{n:0,last:0};u.n++;u.last=Date.now();S.usage[id]=u}
function unitLabel(food,g){
  if(food.u==="g"||food.u==="ml")return fmt(g)+" "+food.u;
  var q=g/food.s, s=q===1?"1":(Math.abs(q-0.5)<0.01?"½":(Math.abs(q-1.5)<0.01?"1½":String(Math.round(q*10)/10).replace(".",",")));
  return s+" "+food.u+" · "+fmt(g)+" g";
}
function addLabel(food){
  if(food.u==="g"||food.u==="ml")return fmt(food.s)+" "+food.u;
  return "1 "+food.u;
}
function pushEntry(dk,food,g,sl,tOff){
  var m=scale(food,g);
  var e={fid:food.id,n:food.n,g:g,u:food.u,s:food.s,k:m.k,p:m.p,c:m.c,f:m.f,t:Date.now()+(tOff||0)};
  if(sl)e.sl=sl;
  if(!S.log[dk])S.log[dk]=[];
  S.log[dk].push(e);
  bump(food.id);
  return e;
}
function addEntry(food,g,silent){
  var e=pushEntry(day,food,g);
  save();
  if(!silent){
    undo=function(){var a=S.log[day];var i=a.indexOf(e);if(i>-1)a.splice(i,1);save();render()};
    toast(food.n+" · "+fmt(e.k)+" kcal","Cofnij",undo);
  }
  return e;
}
function delEntry(e){
  var a=S.log[day],i=a.indexOf(e);
  if(i<0)return;
  a.splice(i,1);save();
  toast("Usunięto "+e.n,"Cofnij",function(){a.splice(Math.min(i,a.length),0,e);save();render()});
  render();
}
function ranked(){
  var out=allFoods().filter(function(f){return S.usage[f.id]});
  out.sort(function(a,b){
    var ua=S.usage[a.id],ub=S.usage[b.id];
    return (ub.n-ua.n)||(ub.last-ua.last);
  });
  return out;
}
function toast(msg,actLbl,act){

  clearTimeout(toastT);
  toastT=setTimeout(hideToast,4200);
}
function hideToast(){document.getElementById("toast").classList.remove("on")}

var sheetEl=document.getElementById("sheet"),scrimEl=document.getElementById("scrim");
function openSheet(build){
  sheetEl.innerHTML="";
  sheetEl.appendChild(el("div",{class:"grab"}));
  build(sheetEl);
  sheetEl.classList.add("on");scrimEl.classList.add("on");
}
function closeSheet(){sheetEl.classList.remove("on");scrimEl.classList.remove("on")}
scrimEl.addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});

function portionSheet(food,opts){
  opts=opts||{};
  var g=opts.g||food.s;
  openSheet(function(root){
    var pv,pvm;
    function upd(){
      var m=scale(food,g);
      pv.innerHTML="";
      pv.appendChild(el("span",{class:"v num",text:fmt(m.k)}));
      pv.appendChild(el("span",{class:"u",text:"kcal · "+unitLabel(food,g)}));
      pvm.innerHTML="";
      [["B",m.p,"var(--p)"],["W",m.c,"var(--c)"],["T",m.f,"var(--f)"]].forEach(function(x){
        pvm.appendChild(el("span",{html:'<span style="color:'+x[2]+';font-weight:700">'+x[0]+'</span> <i class="num">'+fmt(x[1])+" g</i>"}));
      });
      valEl.innerHTML="";
      valEl.appendChild(el("span",{class:"num",text:fmt(g)}));
      valEl.appendChild(el("s",{text:"g"}));
    }
    root.appendChild(el("h3",{id:"sheetTitle",text:food.n}));
    root.appendChild(el("div",{class:"per",text:"100 g = "+fmt(food.k)+" kcal · B "+food.p+" · W "+food.c+" · T "+food.f}));
    pv=el("div",{class:"preview"});root.appendChild(pv);
    pvm=el("div",{class:"pvmac"});root.appendChild(pvm);

    var chips=el("div",{class:"seg"});
    var mults=(food.u==="g"||food.u==="ml")?[0.5,1,1.5,2]:[0.5,1,1.5,2,3];
    mults.forEach(function(m){
      var gg=Math.round(food.s*m);
      var lbl=(food.u==="g"||food.u==="ml")?fmt(gg)+" "+food.u
        :(m===0.5?"½":m===1.5?"1½":String(m))+" "+food.u;
      chips.appendChild(el("button",{text:lbl,onclick:function(){g=gg;upd();paint()}}));
    });
    function paint(){
      [].forEach.call(chips.children,function(b,i){
        b.setAttribute("aria-pressed",Math.round(food.s*mults[i])===g?"true":"false");
      });
    }
    root.appendChild(chips);

    var valEl=el("div",{class:"val"});
    var step=el("div",{class:"stepper"},[
      el("button",{text:"−","aria-label":"Mniej",onclick:function(){g=Math.max(1,g-(g>60?10:5));upd();paint()}}),
      valEl,
      el("button",{text:"+","aria-label":"Więcej",onclick:function(){g=g+(g>=60?10:5);upd();paint()}})
    ]);
    root.appendChild(el("div",{class:"field"},[el("label",{text:"Ilość w gramach"}),step]));

    var row=el("div",{class:"sheetrow"});
    if(opts.entry){
      row.appendChild(el("button",{class:"btn danger",text:"Usuń",onclick:function(){closeSheet();delEntry(opts.entry)}}));
      row.appendChild(el("button",{class:"btn",text:"Zapisz",onclick:function(){
        var m=scale(food,g);
        opts.entry.g=g;opts.entry.k=m.k;opts.entry.p=m.p;opts.entry.c=m.c;opts.entry.f=m.f;
        save();closeSheet();render();
      }}));
    }else{
      row.appendChild(el("button",{class:"btn alt",text:"Anuluj",onclick:closeSheet}));
      row.appendChild(el("button",{class:"btn",text:"Dodaj",onclick:function(){closeSheet();addEntry(food,g);render()}}));
    }
    root.appendChild(row);
    upd();paint();
  });
}

function promptSheet(title,label,value,onOk){
  openSheet(function(root){
    root.appendChild(el("h3",{id:"sheetTitle",text:title}));
    var inp=el("input",{type:"text",value:value||""});
    root.appendChild(el("div",{class:"field"},[el("label",{text:label}),inp]));
    root.appendChild(el("div",{class:"sheetrow"},[
      el("button",{class:"btn alt",text:"Anuluj",onclick:closeSheet}),
      el("button",{class:"btn",text:"Zapisz",onclick:function(){
        var v=inp.value.trim();if(!v)return inp.focus();
        closeSheet();onOk(v);
      }})
    ]));
    setTimeout(function(){inp.focus()},260);
  });
}

  var t=totals(day),G=S.goal;

  /* przesuwanie dni */
  var isToday=day===dkey(new Date());
  wrap.appendChild(el("div",{class:"shuttle"},[

    ])
  ]));

  /* odczyt jak z wagi */
  var left=G.k-t.k, over=left<0;
  var pct=G.k?Math.min(100,t.k/G.k*100):0;
  var gauge=el("div",{class:"gauge"+(over?" over":"")},[el("div",{class:"fill"})]);
  gauge.firstChild.style.width=pct+"%";
  [25,50,75].forEach(function(x){var tk=el("div",{class:"tick"});tk.style.left=x+"%";gauge.appendChild(tk)});
  var nd=el("div",{class:"needle"});nd.style.left="calc("+pct+"% - 1px)";gauge.appendChild(nd);

  wrap.appendChild(el("div",{class:"readout"+(over?" over":"")},[
    el("div",{class:"bignum"},[
      el("span",{class:"v num",text:fmt(Math.abs(left))}),
      el("span",{class:"u",text:"kcal"}),
      el("span",{class:"cap",text:over?"ponad cel":"do celu"})
    ]),
    el("div",{class:"sub",html:"<b class='num'>"+fmt(t.k)+"</b> z <b class='num'>"+fmt(G.k)+"</b> kcal"+(entries(day).length?" · "+entries(day).length+" "+plural(entries(day).length,"pozycja","pozycje","pozycji"):"")}),
    gauge
  ]));

  /* makro */
  var mac=el("div",{class:"macros"});
  [["Białko","p","--p"],["Węglowodany","c","--c"],["Tłuszcz","f","--f"]].forEach(function(x){
    var have=t[x[1]],goal=G[x[1]];
    var w=goal?Math.min(100,have/goal*100):0;
    var spill=goal&&have>goal?Math.min(100-w,(have-goal)/goal*100):0;
    var track=el("div",{class:"track"});
    var bar=el("div",{class:"bar"});bar.style.width=w+"%";track.appendChild(bar);
    if(spill>0){var sp=el("div",{class:"bar spill"});sp.style.width=spill+"%";track.appendChild(sp)}
    var row=el("div",{class:"macro"},[
      el("div",{class:"k"},[el("span",{class:"dot"}),el("span",{text:x[0]})]),
      el("div",{class:"v",html:"<b class='num'>"+fmt(have)+"</b> / <span class='num'>"+fmt(goal)+"</span> g"}),
      track
    ]);
    row.style.setProperty("--hue","var("+x[2]+")");
    mac.appendChild(row);
  });
  wrap.appendChild(mac);
  wrap.appendChild(el("hr",{class:"rule"}));

  /* szybkie dodawanie */
  var quick=ranked().slice(0,10);
  var sc=el("div",{class:"scroller"});
  if(!quick.length){
    DB.filter(function(f){return ["jajko","platki-owsiane","piers-z-kurczaka-grill","ryz-bialy-ugotowany","banan","chleb-zytni-razowy","jogurt-grecki-10","kawa-z-mlekiem"].indexOf(f.id)>-1}).forEach(function(f){quick.push(f)});
  }
  quick.forEach(function(f){
    sc.appendChild(el("button",{class:"chip",onclick:function(){addEntry(f,f.s);render()}},[
      el("span",{class:"n",text:f.n}),
      el("span",{class:"m num",text:"+ "+addLabel(f)+" · "+fmt(scale(f,f.s).k)+" kcal"})
    ]));
  });
  var y=shiftKey(day,-1);
  if(entries(y).length){
    sc.appendChild(el("button",{class:"chip ghost",onclick:function(){copyDay(y)}},[
      el("span",{class:"n",text:"↺ Powtórz wczoraj"})
    ]));
  }
  wrap.appendChild(nlCard());
  wrap.appendChild(el("div",{class:"sec"},[
    el("div",{class:"sechead"},[
      el("h3",{text:ranked().length?"Twoje najczęstsze":"Na start"}),
      el("button",{class:"act",text:"Wszystko →",onclick:function(){go("add")}})
    ]),
    sc
  ]));

  /* wykres 7 dni */
  wrap.appendChild(weekStrip());

  /* log dnia */
  var es=entries(day).slice().sort(function(a,b){return a.t-b.t});
  var sec=el("div",{class:"sec"});
  sec.appendChild(el("div",{class:"sechead"},[el("h3",{text:"Zjedzone"})]));
  if(!es.length){
    sec.appendChild(el("div",{class:"empty",text:"Nic jeszcze nie zapisane. Tapnij coś powyżej albo wejdź w „Dodaj”."}));
  }else{
    var groups={},order=[];
    es.forEach(function(e){var s=slotOf(e);if(!groups[s]){groups[s]=[];order.push(s)}groups[s].push(e)});
    SLOTS.forEach(function(sname){
      if(!groups[sname])return;
      var list=groups[sname];
      var gk=list.reduce(function(a,e){return a+e.k},0);
      var g=el("div",{class:"group"});
      g.appendChild(el("div",{class:"grouphead"},[
        el("span",{class:"t",text:sname}),
        el("span",{class:"k num",text:fmt(gk)+" kcal"}),
        el("button",{class:"save",text:"zapisz zestaw",onclick:function(){saveSet(sname,list)}})
      ]));
      list.forEach(function(e){
        var f=byId(e.fid);
        g.appendChild(el("button",{class:"entry",onclick:function(){
          if(f)portionSheet(f,{g:e.g,entry:e});
          else delEntry(e);
        }},[
          el("span",{class:"n"},[
            el("b",{text:e.n}),
            el("s",{text:(f?unitLabel(f,e.g):fmt(e.g)+" g")})
          ]),
          el("span",{class:"macrodots",html:"<i style='color:var(--p)'>B "+fmt(e.p)+"</i><i style='color:var(--c)'>W "+fmt(e.c)+"</i><i style='color:var(--f)'>T "+fmt(e.f)+"</i>"}),
          el("span",{class:"kc num",html:fmt(e.k)+"<s>kcal</s>"})
        ]));
      });
      sec.appendChild(g);
    });
  }
  wrap.appendChild(sec);
  return wrap;
}
function plural(n,one,few,many){
  if(n===1)return one;
  var m=n%10, h=n%100;
  if(m>=2&&m<=4&&!(h>=12&&h<=14))return few;
  return many;
}

/* pasek 7 dni — jedna seria, jeden odcień; kolor statusu tylko dla przekroczenia celu */
function weekStrip(){
  var days=[];
  for(var i=6;i>=0;i--)days.push(shiftKey(day,-i));
  var vals=days.map(function(k){return totals(k).k});
  var goal=S.goal.k||2000;
  var max=Math.max(goal*1.15,Math.max.apply(null,vals)*1.05,1);
  var strip=el("div",{class:"week"});
  var gl=el("div",{class:"goal"},[el("span",{text:"cel "+fmt(goal)})]);
  gl.style.bottom=(goal/max*100)+"%";
  strip.appendChild(el("div",{class:"band"},[gl,el("div",{class:"base"})]));
  var cols=el("div",{class:"cols"});
  strip.appendChild(cols);
  days.forEach(function(k,i){
    var v=vals[i], over=v>goal, empty=v===0;
    var d=parseKey(k);
    var col=el("button",{
      class:"day"+(over?" over":"")+(empty?" nodata":"")+(k===day?" now":""),
      role:"img",
      "aria-label":DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+": "+fmt(v)+" kcal, cel "+fmt(goal)+" kcal",
      title:dayTitle(k)+" · "+fmt(v)+" kcal",
      onclick:function(){day=k;render();window.scrollTo({top:0,behavior:"smooth"})}
    });
    var bar=el("span",{class:"bar"});
    bar.style.height=Math.max(2,v/max*100)+"%";
    col.appendChild(el("span",{class:"plot"},[bar]));
    col.appendChild(el("span",{class:"lbl",text:DOW1[d.getDay()]}));
    cols.appendChild(col);
  });
  var sum=vals.reduce(function(a,b){return a+b},0);
  var logged=vals.filter(function(v){return v>0}).length;
  return el("div",{class:"sec weekwrap"},[
    el("div",{class:"sechead"},[el("h3",{text:"Ostatnie 7 dni"})]),
    strip,
    el("div",{class:"wkfoot"},[
      el("span",{html:"średnia z zapisanych dni: <b class='num'>"+fmt(logged?sum/logged:0)+"</b> kcal"}),
      el("span",{class:"num",text:logged+"/7"})
    ])
  ]);
}

function copyDay(from){
  var src=entries(from);
  if(!src.length)return;
  if(!S.log[day])S.log[day]=[];
  var added=[];
  src.forEach(function(e){
    var copy={};for(var k in e)copy[k]=e[k];
    copy.t=Date.now()+added.length;
    S.log[day].push(copy);added.push(copy);
    bump(e.fid);
  });
  save();render();
  toast("Skopiowano "+added.length+" "+plural(added.length,"pozycję","pozycje","pozycji"),"Cofnij",function(){
    S.log[day]=S.log[day].filter(function(e){return added.indexOf(e)<0});save();render();
  });
}
function saveSet(name,list){
  promptSheet("Zapisz zestaw","Nazwa",name+" "+parseKey(day).getDate()+"."+(parseKey(day).getMonth()+1),function(v){
    S.sets.push({id:"s"+Date.now(),n:v,items:list.map(function(e){return {fid:e.fid,n:e.n,g:e.g,k:e.k,p:e.p,c:e.c,f:e.f,u:e.u,s:e.s,sl:e.sl}})});
    save();toast("Zestaw „"+v+"” zapisany");render();
  });
}

var SPLITS={bal:{n:"Zbalansowany",p:.30,c:.40,f:.30},hp:{n:"Więcej białka",p:.40,c:.35,f:.25},lc:{n:"Mniej węgli",p:.30,c:.20,f:.50}};
function viewMe(){
  var wrap=document.createDocumentFragment();
  wrap.appendChild(el("h2",{text:"Ja i cele",style:"font-size:22px"}));

  var P=S.profile||{sex:"m",age:30,w:75,h:178,act:1.55,aim:0};
  function stepper(label,key,step,unit,min,max){
    var v=el("div",{class:"val"});
    function paint(){v.innerHTML="";v.appendChild(el("span",{class:"num",text:String(P[key]).replace(".",",")}));v.appendChild(el("s",{text:unit}))}

    var box=el("div",{class:"seg"});

      box.appendChild(el("button",{text:o[1],"aria-pressed":P[key]===o[0]?"true":"false",onclick:function(){

  }
  function refresh(){

  });

    el("div",{class:"eyebrow",text:"Rozkład makro (B / W / T)"}),
    splitBox,
    el("div",{class:"note",html:"Teraz: <b class='num'>"+fmt(S.goal.k)+"</b> kcal · B <b class='num'>"+fmt(S.goal.p)+" g</b> · W <b class='num'>"+fmt(S.goal.c)+" g</b> · T <b class='num'>"+fmt(S.goal.f)+" g</b>"}),
    el("button",{class:"btn alt",text:"Ustaw ręcznie",onclick:manualSheet})
  ]));

  var themeBox=el("div",{class:"seg"});

    el("div",{class:"eyebrow",text:"Motyw"}),themeBox
  ]));

  wrap.appendChild(el("div",{class:"card"},[
    el("div",{class:"eyebrow",text:"Twoje dane"}),
    el("div",{class:"note",text:"Wszystko siedzi tylko w tej przeglądarce (localStorage) — nic nie wychodzi na żaden serwer. Kopia zapasowa to zwykły tekst: skopiuj go sobie gdziekolwiek."}),
    el("button",{class:"btn alt",text:"Kopia zapasowa / przywracanie",onclick:backupSheet}),
    el("button",{class:"btn danger",text:"Wyczyść wszystko",onclick:function(){
      openSheet(function(root){
        root.appendChild(el("h3",{id:"sheetTitle",text:"Wyczyścić wszystko?"}));
        root.appendChild(el("div",{class:"per",text:"Znikną wszystkie wpisy, zestawy i cele. Tego nie da się cofnąć."}));
        root.appendChild(el("div",{class:"sheetrow"},[
          el("button",{class:"btn alt",text:"Zostaw",onclick:closeSheet}),
          el("button",{class:"btn danger",text:"Usuń wszystko",onclick:function(){
            localStorage.removeItem(KEY);
            S={log:{},custom:[],sets:[],usage:{},goal:{k:2200,p:150,c:230,f:70},profile:null,theme:S.theme,split:"bal"};
            closeSheet();day=dkey(new Date());render();toast("Wyczyszczone");
          }})
        ]));
      });
    }})
  ]));
  return wrap;
}
function applySplit(){
  var s=SPLITS[S.split]||SPLITS.bal,k=S.goal.k;
  S.goal.p=Math.round(k*s.p/4);
  S.goal.c=Math.round(k*s.c/4);

function manualSheet(){

    var f={};
    [["k","kcal"],["p","Białko (g)"],["c","Węglowodany (g)"],["f","Tłuszcz (g)"]].forEach(function(x){

function wmatch(a,b){
  if(a===b)return a.length+2;
  var i=0,L=Math.min(a.length,b.length);
  while(i<L&&a.charAt(i)===b.charAt(i))i++;

    var seen={};
    phr.forEach(function(x){
      var w=norm(x).split(/\s+/).filter(Boolean);
      if(!w.length)return;

function matchAt(toks,i){
  var best=null;
  for(var x=0;x<IDX.length;x++){
    var e=IDX[x],w=e.w,k=w.length;
    for(var j=Math.min(k,4);j>=1;j--){
      if(i+j>toks.length)continue;
      var sc=0,ok=true;
      for(var q=0;q<j;q++){
        var t=toks[i+q];
        if(!t.n||t.used||t.brk||t.num!=null||t.unit){ok=false;break}
        var m=wmatch(t.n,w[q]);
        if(!m){ok=false;break}
        sc+=m;
      }
      if(!ok)continue;
      var total=10*j+sc-3*(k-j);
      if(!best||total>best.score||(total===best.score&&k<best.k))best={f:e.f,len:j,score:total,k:k};
      break;

  }
  /* "zapiekanka z 4 jaj, 2 serków…" — pierwszy produkt przed "z" i długą
     listą składników jest nazwą dania, nie składnikiem */
  if(res.items.length>=3&&!res.items[0].qty){
    var after=toks[res.items[0].at+res.items[0].len];
    if(after&&after.n&&(after.n==="z"||after.n==="ze")){
      res.dish=res.items[0].f.n;res.items.shift();
    }
  }
  /* kwalifikator przylegający do produktu, którego nie ma w jego nazwie:
     "piwo light" przy braku wersji light = liczby są nie te */
  /* szukamy do 3 tokenów w obie strony, przeskakując spójniki ("bez cukru"),
     ale nie przechodząc przez przecinek ani przez inny produkt */
  function nearQual(from,dir){
    for(var i=1;i<=3;i++){
      var c=toks[from+dir*i];
      if(!c||c.brk)return null;
      if(c.qual&&!c.used)return c;
      if(c.n==="bez"||c.n==="w"||c.n==="z"||c.n==="ze"||c.n==="na")continue;
      return null;
    }
    return null;
  }
  res.items.forEach(function(it){
    var nn=norm(it.f.n);
    [nearQual(it.at,-1),nearQual(it.at+it.len-1,1)].forEach(function(c){
      if(!c||!c.qual||c.used||it.warn)return;
      var stem=c.n.slice(0,Math.min(6,c.n.length));
      if(nn.indexOf(stem)>-1)return;
      it.warn=c.neg?"bez "+c.raw:c.raw;
      c.used=true;
    });
  });
  toks.forEach(function(t){
    if(t.qual&&!t.used&&t.n.length>=4&&res.skipped.length<6&&res.skipped.indexOf(t.raw)<0)res.skipped.push(t.raw);
  });

  /* ten sam produkt raz bez ilości, raz z ilością ("owsianka: 60 g płatków
     owsianych") to jedna rzecz nazwana dwa razy — zostaje wersja z ilością */
  var withQty={};
  res.items.forEach(function(it){if(it.qty)withQty[it.f.id]=1});
  res.items=res.items.filter(function(it){return it.qty||!withQty[it.f.id]});

  /* niezużyty ułamek na końcu = "zjadłem tego połowę" */
  for(a=toks.length-1;a>=0;a--){
    if(toks[a].frac&&!toks[a].used&&toks[a].num!=null){res.divisor=toks[a].num;break}
  }
  return res;
}

/* ═══════════════════════ 12. arkusz: opis posiłku ═══════════════════════ */
var NLPH="np. na śniadanie zapiekanka z 4 jaj, 2 serków wiejskich, garści pomidorków koktajlowych i 8 oliwek, na górze feta — zjadłem połowę";
var PARTS=[["¼",0.25],["⅓",1/3],["½",0.5],["⅔",2/3],["¾",0.75],["całość",1]];

function nlSheet(prefill){
  var text=prefill||"";
  ask();

  function ask(){
    openSheet(function(root){
      root.appendChild(el("h3",{id:"sheetTitle",text:"Opisz posiłek"}));
      root.appendChild(el("div",{class:"per",text:"Zwykłym zdaniem — z czego się składał i ile z tego zjadłeś. Rozpoznawanie liczy się na Twoim urządzeniu, opis nigdzie nie wychodzi."}));
      var ta=el("textarea",{spellcheck:"false",placeholder:NLPH,style:"min-height:112px"});
      ta.value=text;
      root.appendChild(el("div",{class:"field"},[el("label",{text:"Opis"}),ta]));
      root.appendChild(el("div",{class:"sheetrow"},[
        el("button",{class:"btn alt",text:"Anuluj",onclick:closeSheet}),
        el("button",{class:"btn",text:"Rozpoznaj",onclick:function(){text=ta.value;review(parseMeal(text))}})
      ]));
      setTimeout(function(){ta.focus()},280);
    });
  }

  function review(r){
    var items=r.items.map(function(x){return {f:x.f,g:x.g,warn:x.warn}});
    var part=r.divisor==null?1:r.divisor;
    var sl=r.slot||slot(Date.now());
    var dk=shiftKey(day,r.dayShift);
    var asSet=!!r.dish&&items.length>1;
    var setName=r.dish||sl;
    draw();

    function total(mult){
      var t={k:0,p:0,c:0,f:0};
      items.forEach(function(it){
        var m=scale(it.f,it.g*mult);
        t.k+=m.k;t.p+=m.p;t.c+=m.c;t.f+=m.f;
      });
      return t;
    }
    function draw(){
      openSheet(function(root){
        if(!items.length){
          root.appendChild(el("h3",{id:"sheetTitle",text:"Nie rozpoznałem produktów"}));
          root.appendChild(el("div",{class:"per",text:"Nic z tego opisu nie pasuje do bazy. Spróbuj nazwać składniki prościej („4 jajka”, „150 g ryżu”) albo dodaj brakujący produkt raz na zawsze."}));
          if(r.skipped.length)root.appendChild(el("div",{class:"note",text:"Pominięte słowa: "+r.skipped.join(", ")}));
          root.appendChild(el("div",{class:"sheetrow"},[
            el("button",{class:"btn alt",text:"Popraw opis",onclick:ask}),
            el("button",{class:"btn",text:"Własny produkt",onclick:function(){customSheet({name:text})}})
          ]));
          return;
        }
        root.appendChild(el("h3",{id:"sheetTitle",text:"Rozpoznałem"}));
        root.appendChild(el("div",{class:"per",text:"Trafi do: "+dayTitle(dk).toLowerCase()+(r.dish?" · danie: "+r.dish:"")+". Popraw, co się nie zgadza."}));

        var slBox=el("div",{class:"seg"});
        SLOTS.forEach(function(o){
          slBox.appendChild(el("button",{text:o,"aria-pressed":sl===o?"true":"false",
            onclick:function(){sl=o;draw()}}));
        });
        root.appendChild(el("div",{class:"field"},[el("label",{text:"Posiłek"}),slBox]));

        items.forEach(function(it,ix){
          /* produkty na sztuki/garście chodzą po pół porcji, żeby nie
             wychodziło "3,8 szt" — w gramach normalnie po 10 g */
          var piecey=it.f.u!=="g"&&it.f.u!=="ml";
          var bump=function(dir){
            if(piecey){
              var q=Math.round(it.g/it.f.s*2)/2;
              it.g=Math.round(Math.max(0.5,q+dir*0.5)*it.f.s);
            }else it.g=Math.max(1,it.g+dir*(it.g>=60?10:5));
            draw();
          };
          var m=scale(it.f,it.g);
          var kids=[
            el("div",{class:"n"},[el("b",{text:it.f.n}),el("s",{text:unitLabel(it.f,it.g)})]),
            el("div",{class:"kc num",text:fmt(m.k)+" kcal"}),
            el("button",{class:"rm","aria-label":"Usuń "+it.f.n,onclick:function(){items.splice(ix,1);draw()}},[svg(ICON.x)]),
            el("div",{class:"g"},[
              el("button",{text:"−","aria-label":"Mniej "+it.f.n,onclick:function(){bump(-1)}}),
              el("span",{class:"v num",text:fmt(it.g)+" g"}),
              el("button",{text:"+","aria-label":"Więcej "+it.f.n,onclick:function(){bump(1)}})
            ])
          ];
          if(it.warn)kids.push(el("div",{class:"warn"},[
            svg(ICON.alert),
            el("span",{},[
              el("span",{text:"nie mam wersji „"+it.warn+"” — liczby są dla zwykłej. "}),
              el("button",{text:"popraw wartości",onclick:function(){
                customSheet({name:it.f.n+" "+it.warn,base:it.f,onFood:function(food){
                  it.f=food;it.warn=null;draw();
                }});
              }})
            ])
          ]));
          root.appendChild(el("div",{class:"nlrow"},kids));
        });

        var pBox=el("div",{class:"seg"});
        PARTS.forEach(function(o){
          pBox.appendChild(el("button",{text:o[0],"aria-pressed":Math.abs(part-o[1])<0.02?"true":"false",
            onclick:function(){part=o[1];draw()}}));
        });
        root.appendChild(el("div",{class:"field",style:"margin-top:14px"},[
          el("label",{text:"Ile z tego zjadłeś"}),pBox]));

        var t=total(part);
        root.appendChild(el("div",{class:"nltot"},[
          el("span",{class:"v num",text:fmt(t.k)}),
          el("span",{class:"u",text:part<1?"kcal — z całości "+fmt(total(1).k):"kcal"})
        ]));
        root.appendChild(el("div",{class:"pvmac",html:
          "<span style='color:var(--p);font-weight:700'>B</span> <i class='num'>"+fmt(t.p)+" g</i>"+
          "<span style='color:var(--c);font-weight:700'>W</span> <i class='num'>"+fmt(t.c)+" g</i>"+
          "<span style='color:var(--f);font-weight:700'>T</span> <i class='num'>"+fmt(t.f)+" g</i>"}));

        if(r.skipped.length)root.appendChild(el("div",{class:"note",text:"Pominięte słowa: "+r.skipped.join(", ")+". Jeśli któreś z nich to jedzenie, dopisz je prościej albo dodaj jako własny produkt."}));

        if(items.length>1){
          var nameF=el("input",{type:"text",value:setName,oninput:function(){setName=this.value}});
          var tg=el("button",{class:"toggle","aria-pressed":asSet?"true":"false",onclick:function(){asSet=!asSet;draw()}},[
            el("span",{class:"box"},[svg(ICON.check)]),
            el("span",{class:"lb",text:"Zapisz też jako zestaw — następny raz jedno tapnięcie"})
          ]);
          root.appendChild(tg);
          if(asSet)root.appendChild(el("div",{class:"field"},[el("label",{text:"Nazwa zestawu"}),nameF]));
        }

        root.appendChild(el("div",{class:"sheetrow"},[
          el("button",{class:"btn alt",text:"Popraw opis",onclick:ask}),
          el("button",{class:"btn",text:"Dodaj "+items.length+" "+plural(items.length,"pozycję","pozycje","pozycji"),onclick:commit})
        ]));
      });
    }
    function commit(){
      var added=[];
      items.forEach(function(it,ix){
        added.push(pushEntry(dk,it.f,Math.max(1,Math.round(it.g*part)),sl,ix));
      });
      var savedSet=null;
      if(asSet&&items.length>1){
        savedSet={id:"s"+Date.now(),n:(setName||"Posiłek").trim(),items:added.map(function(e){
          return {fid:e.fid,n:e.n,g:e.g,k:e.k,p:e.p,c:e.c,f:e.f,u:e.u,s:e.s,sl:e.sl};
        })};
        S.sets.push(savedSet);
      }
      save();closeSheet();
      day=dk;render();
      toast("Dodano "+added.length+" "+plural(added.length,"pozycję","pozycje","pozycji")+" · "+fmt(total(part).k)+" kcal","Cofnij",function(){
        S.log[dk]=(S.log[dk]||[]).filter(function(e){return added.indexOf(e)<0});
        if(savedSet){var i=S.sets.indexOf(savedSet);if(i>-1)S.sets.splice(i,1)}
        save();render();
      });
    }
  }
}
function nlCard(){
  return el("button",{class:"nlcard",onclick:function(){nlSheet()}},[
    el("span",{class:"ic"},[svg(ICON.pen)]),
    el("span",{class:"tx"},[
      el("b",{text:"Opisz posiłek zdaniem"}),
      el("s",{text:"„zapiekanka z 4 jaj, 2 serków i 8 oliwek — zjadłem połowę”"})
    ])
  ]);
}

/* ═══════════════════════ 10. render ═══════════════════════ */
var VIEWS={today:viewToday,add:viewAdd,meals:viewSets,me:viewMe};
var TABS=[["today","Dziś",ICON.today],["add","Dodaj",ICON.add],["meals","Zestawy",ICON.meals],["me","Ja",ICON.me]];
function go(v){view=v;render();window.scrollTo({top:0})}
function renderChrome(){
  var t=totals(day),left=S.goal.k-t.k;
  document.getElementById("brandSub").textContent=left>=0?fmt(left)+" kcal do celu":fmt(-left)+" kcal ponad";
}
function render(){
  var v=document.getElementById("view");
  v.innerHTML="";
  v.appendChild(VIEWS[view]());
  var tabs=document.getElementById("tabs");
  tabs.innerHTML="";
  TABS.forEach(function(t){
    var b=el("button",{class:"tab","aria-current":view===t[0]?"page":null,onclick:function(){go(t[0])}},[
      svg(t[2]),el("span",{text:t[1]})
    ]);
    tabs.appendChild(b);
  });
  renderChrome();
}
function applyTheme(){
  if(S.theme==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",S.theme);
}
document.getElementById("themeBtn").addEventListener("click",function(){
  var order=["auto","light","dark"],i=order.indexOf(S.theme);
  S.theme=order[(i+1)%3];applyTheme();save();
  toast("Motyw: "+({auto:"auto",light:"jasny",dark:"ciemny"}[S.theme]));
  if(view==="me")render();
});

/* uchwyt dla testów — parser bywa jedyną częścią, którą warto sprawdzić
   bez klikania po ekranach */
window.MAKRO={parse:parseMeal,alias:ALIAS,foods:allFoods,byId:byId,scale:scale};

/* Offline. Rejestrujemy service workera tylko wtedy, gdy strona jest
   hostowana i ma manifest — wersja jednoplikowa (Artifact, file://) nie ma
   tych plików, więc nie ma czego rejestrować. */
if("serviceWorker" in navigator
   && document.querySelector('link[rel="manifest"]')
   && window.isSecureContext){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

load();
if(S.profile&&!S.goal.p)applySplit();
applyTheme();
day=dkey(new Date());
render();
})();
</script>
