<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Licznik Makro</title>
<meta name="description" content="Prosty licznik kalorii i makro — dodajesz jedzenie jednym tapnięciem, bez wpisywania.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Makro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ─────────── system: monochromatyczny interfejs, kolor tylko dla danych ───────────
   Krój systemowy (bez zewnętrznych fontów), promienie i kontrolki jak w
   aplikacjach natywnych, kolor niosą wyłącznie makro, wykres i przekroczenie
   celu. Chrom jest czarno-biały, żeby liczby były jedyną rzeczą, która krzyczy. */
:root{
  --ground:#EDEFF2; --bg:#FFFFFF; --sunk:#F3F4F6; --raise:#FFFFFF;
  --line:#E6E8EB; --line-2:#D5D9DE;
  --ink:#0B0D10; --ink-2:#596069; --ink-3:#8C949D;
  --accent:#0B0D10; --accent-ink:#FFFFFF; --tint:#F1F2F4;
  --p:#04795B; --c:#B5761B; --f:#6B4C9A; --data:#04795B; --over:#D03B3B;
  --sh:0 1px 2px rgba(11,13,16,.05), 0 10px 24px -14px rgba(11,13,16,.18);
  --sh-thumb:0 1px 3px rgba(11,13,16,.12);
  --sh-sheet:0 -10px 44px -14px rgba(11,13,16,.28);
  --r:18px; --r-sm:12px; --r-lg:26px; --pill:999px; --tap:48px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#000000; --bg:#0C0E11; --sunk:#171A1F; --raise:#1B1F25;
    --line:#23272E; --line-2:#333941;
    --ink:#F4F6F9; --ink-2:#A4ACB6; --ink-3:#717A85;
    --accent:#F4F6F9; --accent-ink:#0C0E11; --tint:#1B1F25;
    --p:#22997A; --c:#B8862A; --f:#8A6FC2; --data:#22997A;
    --sh:none; --sh-thumb:0 1px 3px rgba(0,0,0,.5);
    --sh-sheet:0 -10px 44px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#000000; --bg:#0C0E11; --sunk:#171A1F; --raise:#1B1F25;
  --line:#23272E; --line-2:#333941;
  --ink:#F4F6F9; --ink-2:#A4ACB6; --ink-3:#717A85;
  --accent:#F4F6F9; --accent-ink:#0C0E11; --tint:#1B1F25;
  --p:#22997A; --c:#B8862A; --f:#8A6FC2; --data:#22997A;
  --sh:none; --sh-thumb:0 1px 3px rgba(0,0,0,.5);
  --sh-sheet:0 -10px 44px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.4; letter-spacing:-.011em;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
/* dotyk zamiast hovera: wgniecenie pod palcem */
.chip,.addbtn,.btn,.tab,.nav button,.seg button,.dictate,.nlmain,.nlmic,.rm,
.stepper button,.iconbtn,.edit,.cat,.toggle,.entry,.food .body,.day,.update button{
  transition:transform .09s ease, background-color .15s ease, opacity .15s ease;
}
.chip:active,.addbtn:active,.btn:active,.nav button:active,.seg button:active,
.dictate:active,.nlmain:active,.nlmic:active,.rm:active,.stepper button:active,
.iconbtn:active,.edit:active,.cat:active,.toggle:active,.update button:active{transform:scale(.965)}

/* ─────────── powłoka ─────────── */
.app{
  max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--bg);position:relative;display:flex;flex-direction:column;
}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 30px 80px -40px rgba(11,13,16,.35)}}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:max(12px,env(safe-area-inset-top)) 18px 12px;
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px) saturate(180%);
}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.03em}
.brand span{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:44px;height:44px;flex:none;display:grid;place-items:center;
  border-radius:var(--pill);background:var(--sunk);color:var(--ink-2);
}
/* svg() nie podaje wymiarów, a bezwymiarowy inline-SVG zachowuje się zależnie
   od kontenera: w gridzie rozciąga się na całe pole, we fleksie ZAPADA DO ZERA
   i ikona po prostu znika. Dlatego rozmiar bazowy jest tu, a nie w każdym
   komponencie osobno — wszystkie reguły niżej mają wyższą specyficzność
   i nadpisują go tam, gdzie potrzeba czegoś innego. */
button svg,.warn svg{width:19px;height:19px;flex:none}
.iconbtn svg{width:19px;height:19px}
/* Poprawianie własnego produktu to czynność drugorzędna wobec dodania go —
   pole dotyku pełne (44 px), ale wygląd lekki: bez tła i w szarości. */
.edit{
  width:44px;height:44px;flex:none;display:grid;place-items:center;
  border-radius:var(--pill);background:transparent;color:var(--ink-3);
}
.edit svg{width:17px;height:17px}
/* Usuwanie jest równie drugorzędne jak poprawianie — ta sama forma, inny
   kolor. Trzy różne kształty przycisków w jednym wierszu to trzy różne
   sygnały o tej samej wadze. */
.edit.danger{color:var(--over)}
main{flex:1;padding:6px 18px 28px;display:flex;flex-direction:column;gap:26px}

/* ─────────── zakładki ─────────── */
.tabs{
  position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;color:var(--ink-3);font-size:11px;font-weight:500}
.tab svg{width:24px;height:24px;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke-width:2.4}
.tab[aria-current="page"] span{font-weight:600}

/* ─────────── nagłówek dnia ─────────── */
.shuttle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shuttle h2,main>h2{font-size:30px;line-height:1.1}
.shuttle .dow{font-size:14px;color:var(--ink-3);margin-top:2px}
.nav{display:flex;gap:6px}
.nav button{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--pill);background:var(--sunk);color:var(--ink-2)}
.nav button:disabled{opacity:.35;cursor:default}

/* ─────────── karta z odczytem i makro ─────────── */
.readout{
  display:flex;flex-direction:column;gap:14px;
  background:var(--raise);border-radius:var(--r-lg);padding:20px 18px 18px;box-shadow:var(--sh);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .readout{border:1px solid var(--line)}}
:root[data-theme="dark"] .readout{border:1px solid var(--line)}
.bignum{display:flex;align-items:flex-end;gap:8px;line-height:.86}
.bignum .v{font-size:58px;font-weight:700;letter-spacing:-.045em}
.bignum .u{font-size:15px;font-weight:600;color:var(--ink-3);padding-bottom:7px}
.bignum .cap{font-size:13px;color:var(--ink-3);padding-bottom:9px;margin-left:auto}
.readout.over .bignum .v{color:var(--over)}
/* Bilans tygodnia w karcie odczytu: jedna linijka, bo to kontekst dla wielkiej
   liczby wyżej, a nie osobny temat. */
.wkbank{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;
  padding:11px 12px;border-radius:var(--r-sm);background:var(--tint);
  font-size:13.5px;color:var(--ink-2);text-align:left}
.wkbank b{color:var(--ink);font-weight:700}
.wkbank .go{margin-left:auto;flex:none;color:var(--ink-3)}
.wkbank .go svg{width:15px;height:15px}
/* Pasek trzydziestu dni: jedna kropka to jeden dzień. Pełna — czysty,
   obwódka — dzień z alkoholem, blada — dzień bez zapisu. */
.strip{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.strip i{width:8px;height:8px;border-radius:50%;background:var(--p);flex:none}
.strip i.alko{background:transparent;box-shadow:inset 0 0 0 1.5px var(--over)}
.strip i.none{background:var(--line-2)}
.strip i.today{outline:2px solid var(--ink);outline-offset:2px}

/* Podpowiedzi domykające dzień — lista produktów z gramaturą. */
.closer{background:var(--sunk);border-radius:var(--r-lg);padding:16px;display:flex;
  flex-direction:column;gap:10px}
.closer .hd b{display:block;font-size:16px;font-weight:600}
.closer .hd s{display:block;text-decoration:none;font-size:13px;color:var(--ink-3);margin-top:2px}
.closer .opt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r-sm);
  background:var(--bg);text-align:left;width:100%}
.closer .opt .n{flex:1;min-width:0;font-size:15px;font-weight:500}
.closer .opt .n s{display:block;text-decoration:none;font-size:12.5px;color:var(--ink-3);font-weight:400;margin-top:1px}
.closer .opt .kc{flex:none;font-size:14px;font-weight:700}
.sub{font-size:14px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.sub b{font-weight:600;color:var(--ink-2)}
.gauge{position:relative;height:10px;background:var(--sunk);border-radius:var(--pill);overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--data);border-radius:var(--pill);transition:width .45s cubic-bezier(.22,.7,.25,1)}
.gauge.over .fill{background:var(--over)}
.macros{display:flex;flex-direction:column;gap:14px;padding-top:6px;margin-top:4px;border-top:1px solid var(--line)}
.macro{display:grid;grid-template-columns:1fr auto;gap:7px 10px;align-items:baseline}
.macro .k{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink-2)}
.macro .dot{width:8px;height:8px;border-radius:var(--pill);background:var(--hue);flex:none}
.macro .v{font-size:14px;color:var(--ink-3)}
.macro .v b{color:var(--ink);font-weight:600}
.macro .track{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:var(--pill);overflow:hidden;display:flex}
.macro .bar{background:var(--hue);border-radius:var(--pill);transition:width .45s cubic-bezier(.22,.7,.25,1)}
.macro .bar.spill{background:var(--over);margin-left:2px}

/* ─────────── sekcje ─────────── */
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sechead h3{font-size:19px}
/* Sam tekst ma 20 px wysokości, a to za mało na kciuk — pole dotyku
   rozciągamy do 44 px, nie ruszając wyglądu. */
.sechead .act{
  font-size:14px;font-weight:600;color:var(--ink-2);
  min-height:44px;display:inline-flex;align-items:center;padding:0 2px;margin:-12px -2px;
}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-3)}
.rule{display:none}

/* ─────────── wykres 7 dni ─────────── */
.week{position:relative;padding-top:16px}
.week .band{position:absolute;left:0;right:0;top:16px;height:64px;pointer-events:none}
.week .goal{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line-2)}
.week .goal span{position:absolute;right:0;top:-16px;font-size:11px;color:var(--ink-3)}
.week .base{display:none}
.week .cols{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day{display:block;padding:0;border-radius:var(--r-sm)}
.day .plot{display:block;position:relative;height:64px}
.day .bar{position:absolute;left:0;right:0;bottom:0;display:block;background:var(--data);border-radius:6px;min-height:3px;transition:height .4s cubic-bezier(.22,.7,.25,1)}
.day.over .bar{background:var(--over)}
.day.nodata .bar{background:var(--line)}
.day .lbl{display:block;margin-top:8px;font-size:12px;text-align:center;color:var(--ink-3)}
.day.now .lbl{color:var(--ink);font-weight:700}
.day.now .bar{outline:2px solid var(--ink);outline-offset:2px}
.wkfoot{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-top:14px}
.wkfoot b{color:var(--ink-2);font-weight:600}

/* ─────────── kafle szybkiego dodania ─────────── */
.chip{
  flex:none;display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:12px 15px;min-width:132px;background:var(--sunk);border-radius:var(--r);scroll-snap-align:start;
}
.chip .n{font-size:14.5px;font-weight:600;line-height:1.25}
.chip .m{font-size:12.5px;color:var(--ink-3)}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2);align-items:center;min-width:auto;padding:12px 18px}
.chip.ghost .n{color:var(--ink-2)}

/* ─────────── log dnia ─────────── */
.group{display:flex;flex-direction:column}
.grouphead{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.grouphead .t{font-size:15px;font-weight:700;letter-spacing:-.02em}
.grouphead .k{font-size:13px;color:var(--ink-3);margin-left:auto}
.grouphead .save{font-size:13px;font-weight:600;color:var(--ink-3)}
.entry{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;min-height:var(--tap);border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .n{flex:1;min-width:0}
.entry .n b{display:block;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .n s{display:block;text-decoration:none;font-size:13px;color:var(--ink-3);margin-top:1px}
.entry .kc{font-size:16px;font-weight:700;flex:none;letter-spacing:-.02em}
.entry .kc s{text-decoration:none;font-size:11px;color:var(--ink-3);font-weight:500;margin-left:3px}
.macrodots{display:flex;gap:8px;font-size:12px;color:var(--ink-3)}
.macrodots i{font-style:normal}

/* ─────────── szukanie i lista produktów ─────────── */
.search{position:relative}
.search input{
  width:100%;padding:14px 40px 14px 42px;border:0;border-radius:var(--r-sm);
  background:var(--sunk);font-size:16px;
}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:grid;place-items:center;color:var(--ink-3);border-radius:var(--pill);background:var(--tint)}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:var(--pill);background:var(--sunk);font-size:14px;color:var(--ink-2);white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.food{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:0}
.food .body{flex:1;min-width:0;padding:13px 0;min-height:var(--tap)}
.food .body b{display:block;font-weight:500;font-size:16px}
.food .body s{display:block;text-decoration:none;font-size:13px;color:var(--ink-3);margin-top:1px}
.addbtn{
  flex:none;display:flex;align-items:center;gap:5px;padding:9px 14px;border-radius:var(--pill);
  background:var(--sunk);color:var(--ink);font-size:14px;font-weight:600;min-height:44px;
}
.addbtn svg{width:14px;height:14px;stroke-width:2.8}
.empty{padding:34px 8px;text-align:center;color:var(--ink-3);font-size:15px}

/* ─────────── formularze, kontrolki, przyciski ─────────── */
.card{background:var(--sunk);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label{font-size:13px;font-weight:600;color:var(--ink-3)}
.field input,.field textarea{width:100%;padding:13px 14px;border:0;border-radius:var(--r-sm);background:var(--tint);font-size:16px}
.field textarea{font-size:15px;min-height:100px;line-height:1.45;resize:vertical}
.card .field input,.card .field textarea{background:var(--bg)}
/* przełącznik segmentowy: szary tor, wybrany segment jak biały suwak */
.seg{display:flex;gap:3px;background:var(--tint);border-radius:var(--pill);padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;white-space:nowrap;padding:9px 14px;border-radius:var(--pill);font-size:14.5px;color:var(--ink-2);text-align:center;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:var(--sh-thumb)}
.card .seg{background:var(--bg)}
.card .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:var(--pill);background:var(--tint);font-size:22px;font-weight:500}
.card .stepper button{background:var(--bg)}
.stepper .val{flex:1;display:flex;align-items:baseline;justify-content:center;gap:7px;
  text-align:center;font-size:21px;font-weight:700;letter-spacing:-.03em}
.stepper .val s{text-decoration:none;font-size:13px;color:var(--ink-3);font-weight:500;flex:none}
/* Liczba jest polem do wpisania, nie tylko wyświetlaczem: dojeżdżanie plusem
   do 200 g to czterdzieści tapnięć. Wygląda jak tekst, działa jak input. */
.val input,.nlrow .g .v input{
  font:inherit;color:inherit;letter-spacing:inherit;text-align:center;
  background:transparent;border:0;padding:0;margin:0;min-width:0;
  /* To pole jest celem tapnięcia, więc obowiązuje je to samo minimum co
     przyciski — 44 px. Stepper i tak jest tej wysokości. */
  min-height:44px;
  -moz-appearance:textfield;
}
.val input::-webkit-outer-spin-button,.val input::-webkit-inner-spin-button,
.nlrow .g .v input::-webkit-outer-spin-button,.nlrow .g .v input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;
}
.stepper .val input{width:3.9em}
.nlrow .g .v input{width:3.4em}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 18px;
  border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);
  font-weight:600;font-size:16.5px;min-height:52px;letter-spacing:-.015em;
}
.btn.alt{background:var(--tint);color:var(--ink)}
.card .btn.alt{background:var(--bg)}
.btn.danger{background:transparent;color:var(--over);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--over) 45%,transparent)}
.note{font-size:13.5px;color:var(--ink-3);line-height:1.5}
/* Arkusz układa dzieci bez odstępów, więc kolejne akapity się zlepiały. */
.sheet .note+.note,.sheet .field+.note,.sheet .note+.field{margin-top:12px}
.toggle{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;border-top:1px solid var(--line)}
.toggle .box{flex:none;width:24px;height:24px;border-radius:8px;background:var(--tint);display:grid;place-items:center;color:transparent}
.toggle[aria-pressed="true"] .box{background:var(--accent);color:var(--accent-ink)}
.toggle .box svg{width:14px;height:14px;stroke-width:3}
.toggle .lb{font-size:15px;text-align:left}

/* ─────────── opis / dyktowanie ─────────── */
.nlcard{background:var(--sunk);border-radius:var(--r-lg);display:flex;align-items:stretch;width:100%;overflow:hidden}
.nlmain,.wtrow{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:16px}
.nlmic{flex:none;width:64px;display:grid;place-items:center;color:var(--ink)}
.nlmic svg{width:24px;height:24px}
.nlcard .ic{flex:none;width:38px;height:38px;border-radius:var(--pill);background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.nlcard .ic svg{width:19px;height:19px}
.nlcard .tx{min-width:0}
.nlcard .tx b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.nlcard .tx s{display:block;text-decoration:none;font-size:13px;color:var(--ink-3);line-height:1.35;margin-top:2px}
.dictate{display:flex;align-items:center;gap:14px;width:100%;padding:15px;border-radius:var(--r);background:var(--sunk);margin-bottom:14px}
.dictate .ic{flex:none;width:40px;height:40px;border-radius:var(--pill);display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.dictate .ic svg{width:19px;height:19px}
.dictate .lb{flex:1;min-width:0;font-size:16px;font-weight:600;text-align:left}
.dictate .lb s{display:block;text-decoration:none;font-size:13px;font-weight:400;color:var(--ink-3);margin-top:2px}
.dictate.on{background:color-mix(in srgb,var(--over) 12%,var(--sunk))}
.dictate.on .ic{background:var(--over);color:#fff;animation:pulse 1.5s ease-in-out infinite}
.dictate[disabled]{opacity:.5}
.dictate[disabled] .ic{background:var(--line-2);color:var(--ink-3)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--over) 50%,transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--over) 0%,transparent)}}
.dictnote{font-size:13px;color:var(--ink-3);line-height:1.5;margin-bottom:16px}

/* ─────────── wiersze podglądu ─────────── */
.nlrow{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.nlrow .n{grid-column:1;min-width:0}
.nlrow .n b{display:block;font-size:16px;font-weight:500}
.nlrow .n s{display:block;text-decoration:none;font-size:13px;color:var(--ink-3);margin-top:1px}
.nlrow .kc{grid-column:2;font-size:15px;font-weight:700;letter-spacing:-.02em}
.nlrow .rm{grid-column:3;width:44px;height:44px;display:grid;place-items:center;border-radius:var(--pill);background:var(--tint);color:var(--ink-3)}
.nlrow .rm svg{width:13px;height:13px;stroke-width:2.4}
.nlrow .g{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding-top:8px}
.nlrow .g button{width:44px;height:44px;flex:none;border-radius:var(--pill);background:var(--tint);display:grid;place-items:center;font-size:18px;font-weight:500}
.nlrow .g .v{min-width:68px;display:flex;align-items:baseline;justify-content:center;gap:7px;
  text-align:center;font-size:15px;font-weight:600}
.nlrow .g .v s{text-decoration:none;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-left:3px}
.nlrow .warn{grid-column:1/-1;display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--over);line-height:1.45;padding-top:8px}
.nlrow .warn svg{width:14px;height:14px;flex:none;margin-top:2px}
.nlrow .warn button{color:var(--over);font-weight:700;text-decoration:underline;font-size:13px}
.nltot{display:flex;align-items:baseline;gap:10px;padding:20px 0 4px}
.nltot .v{font-size:36px;font-weight:700;letter-spacing:-.04em}
.nltot .u{font-size:14px;color:var(--ink-3)}
.preview{display:flex;align-items:baseline;gap:9px;padding:14px 0 4px}
.preview .v{font-size:40px;font-weight:700;letter-spacing:-.04em}
.preview .u{font-size:14px;color:var(--ink-3)}
.pvmac{display:flex;gap:16px;font-size:13.5px;color:var(--ink-3);padding-bottom:18px}
.pvmac i{font-style:normal;font-weight:600;color:var(--ink-2)}

/* ─────────── arkusz dolny ─────────── */
.scrim{position:fixed;inset:0;background:rgba(6,8,10,.45);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .28s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:460px;margin:0 auto;
  background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--sh-sheet);
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .38s cubic-bezier(.32,.9,.28,1);
  max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:var(--pill);background:var(--line-2);margin:6px auto 16px}
.sheet h3{font-size:24px;margin-bottom:4px}
.sheet .per{font-size:14.5px;color:var(--ink-3);margin-bottom:18px;line-height:1.45}
.sheet .seg{margin-bottom:18px}
.sheet .field+.field{margin-top:16px}
.sheetrow{display:flex;gap:10px;padding-top:16px}
.sheetrow .btn{flex:1}

/* ─────────── nowa wersja i komunikaty ─────────── */
.update{
  position:fixed;left:18px;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));
  z-index:45;max-width:424px;margin:0 auto;display:flex;align-items:center;gap:12px;
  background:var(--accent);color:var(--accent-ink);padding:12px 12px 12px 16px;
  border-radius:var(--r);box-shadow:var(--sh);font-size:15px;
}
.update .tx{flex:1;min-width:0;font-weight:500}
.update button{flex:none;font-weight:600;font-size:14.5px;padding:8px 14px;border-radius:var(--pill);background:color-mix(in srgb,var(--accent-ink) 18%,transparent);color:inherit}
.update button:disabled{opacity:.6}
body.hasupd .toast{bottom:calc(136px + env(safe-area-inset-bottom))}
/* Ta sama geometria co pasek aktualizacji. Wcześniej było tu left:50% bez
   right, a to przycina dostępną szerokość do POŁOWY ekranu — max-width nigdy
   nie wchodził w grę i nazwa produktu łamała się na cztery linijki. */
.toast{
  position:fixed;left:18px;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));
  z-index:50;max-width:424px;margin:0 auto;display:flex;align-items:center;gap:12px;
  background:var(--ink);color:var(--bg);padding:10px 10px 10px 18px;border-radius:var(--r);
  font-size:15px;box-shadow:var(--sh);
  opacity:0;transform:translateY(16px);pointer-events:none;transition:.24s cubic-bezier(.22,.7,.25,1);
}
.toast.on{opacity:1;transform:translateY(0);pointer-events:auto}
/* Komunikat bierze całą wolną szerokość i łamie się najwyżej na dwie linijki;
   przycisk zostaje przy prawej krawędzi i nigdy się nie zwęża. */
.toast .tx{flex:1;min-width:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast button{flex:none;font-weight:600;font-size:14.5px;min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:var(--pill);background:color-mix(in srgb,var(--bg) 22%,transparent);color:inherit}

/* Szybkie tapnięcia w ten sam przycisk iOS bierze za podwójne tapnięcie
   i przybliża stronę. To wyłącza sam ten gest — zsuwanie palcami zostaje. */
button,input,select,textarea,a,[role="button"],.entry,.food .body,.day{touch-action:manipulation}

/* Reguły :hover tylko tam, gdzie kursor naprawdę istnieje. Na ekranie
   dotykowym iOS pierwsze tapnięcie na elemencie ze stylem :hover jedynie
   go "najeżdża", a dopiero drugie klika. */
@media (hover:hover) and (pointer:fine){
.iconbtn:hover{background:var(--tint);color:var(--ink)}
  .edit:hover{background:var(--tint);color:var(--ink)}
.nav button:hover:not(:disabled){background:var(--tint);color:var(--ink)}
.chip:hover{background:var(--tint)}
.entry:hover{background:var(--sunk)}
.food:hover{background:var(--sunk)}
.addbtn:hover{background:var(--accent);color:var(--accent-ink)}
.btn:hover{opacity:.88}
.nlmain:hover,.nlmic:hover{background:var(--tint)}
.stepper button:hover,.nlrow .g button:hover{background:var(--line)}
.nlrow .rm:hover{background:var(--over);color:#fff}
.cat:hover{background:var(--tint)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

function norm(s){
  return String(s).toLowerCase()
    .replace(/ł/g,"l").replace(/Ł/g,"l")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function n0(x){return Math.round(x)}

function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseKey(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function shiftKey(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)}

function dayTitle(k){
  var t=dkey(new Date());
  if(k===t)return "Dziś";
  if(k===shiftKey(t,-1))return "Wczoraj";
  if(k===shiftKey(t,1))return "Jutro";
  var d=parseKey(k);return d.getDate()+" "+MON[d.getMonth()];
}
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)for(var a in attrs){
    if(a==="class")e.className=attrs[a];
    else if(a==="html")e.innerHTML=attrs[a];
    else if(a==="text")e.textContent=attrs[a];
    else if(a.slice(0,2)==="on")e.addEventListener(a.slice(2),attrs[a]);
    else if(a.slice(0,2)==="--")e.style.setProperty(a,attrs[a]);
    else if(attrs[a]!=null)e.setAttribute(a,attrs[a]);
  }
  (kids||[]).forEach(function(k){if(k)e.appendChild(k)});
  return e;
}

  scale:'<rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M8 9.2a5.5 5.5 0 0 1 8 0"/><path d="M12 12.6 14.4 9.6"/>'
};

/* ═══════════════════════ 3. stan ═══════════════════════ */
var KEY="makro.v1";
var S={log:{},custom:[],sets:[],usage:{},wt:{},goal:{k:2200,p:150,c:230,f:70},profile:null,theme:"auto",split:"bal"};
var loadFailed=false;
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){return}
  if(!raw)return;
  try{
    var r=JSON.parse(raw);
    if(r&&typeof r==="object"){
      ["log","custom","sets","usage","goal","profile","theme","split","wt"].forEach(function(k){
        if(r[k]!=null)S[k]=r[k];
      });
    }
  }catch(e){
    /* Zapis mógł zostać ucięty w pół (brak miejsca, zabity proces). Wtedy
       pierwsza zmiana nadpisałaby uszkodzony wpis pustym stanem i historia
       przepadłaby na zawsze — więc najpierw odkładamy go na bok. */
    loadFailed=true;
    try{localStorage.setItem(KEY+".uszkodzone",raw)}catch(e2){}
  }
}
var saveT=null;
function flush(force){
  if(force)snapshot(true);
  if(!saveT)return;
  clearTimeout(saveT);saveT=null;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Nie udało się zapisać danych")}
  snapshot(false);
}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(flush,80);
}
/* Zapis bez zwłoki. flush() sam z siebie nic nie robi, gdy nic nie czeka
   w kolejce, więc do „zapisz teraz” trzeba obu wywołań. */
function saveNow(){save();flush(true)}

/* iOS trzyma localStorage apki z ekranu głównego ODDZIELNIE od Safari, więc po
   dodaniu ikonki apka wstaje pusta, choć dane nadal są w Safari. Wspólne dla
   obu jest Cache Storage, więc odkładamy tam migawkę stanu i przy pustym
   starcie proponujemy jej przeniesienie. Nigdy nie wczytujemy jej sama z
   siebie — po „Wyczyść wszystko” dane mają zostać wyczyszczone. */
var SNAP="makro-dane",SNAPURL="./__dane.json",snapT=0;
function hasCaches(){
  /* Na file:// Cache Storage istnieje, ale nie przyjmuje adresów tego schematu
     — a wersja jednoplikowa i tak nie ma czego dzielić z Safari. */
  if(location.protocol!=="http:"&&location.protocol!=="https:")return false;
  try{return typeof caches!=="undefined"&&!!caches.open}catch(e){return false}
}
function snapshot(force){
  if(!hasCaches())return;
  var now=Date.now();
  if(!force&&now-snapT<5000)return;
  snapT=now;
  try{
    var body=JSON.stringify({at:now,data:S});
    caches.open(SNAP).then(function(c){
      /* bez return odrzucenie put() wychodzi poza ten catch */
      return c.put(SNAPURL,new Response(body,{headers:{"Content-Type":"application/json"}}));
    })["catch"](function(){});
  }catch(e){}
}
function readSnapshot(){
  if(!hasCaches())return Promise.resolve(null);
  return caches.open(SNAP).then(function(c){return c.match(SNAPURL)}).then(function(r){
    return r?r.json():null;
  })["catch"](function(){return null});
}
function dropSnapshot(){
  if(!hasCaches())return;
  try{caches["delete"](SNAP)["catch"](function(){})}catch(e){}
}
function countEntries(log){
  var n=0;for(var k in log)if(log[k]&&log[k].length)n+=log[k].length;return n;
}
/* Zapis jest opóźniony o 80 ms, żeby seria zmian nie pisała po każdej z nich.
   Gdy strona znika — przeładowanie po aktualizacji, przełączenie apki, zamknięcie
   karty — trzeba dopisać natychmiast, inaczej ostatnia zmiana przepada. */
/* Jawnie z force=true: pagehide przekazałby obiekt zdarzenia jako argument,
   a to nie jest coś, na czym chce się opierać zapis danych. */
window.addEventListener("pagehide",function(){flush(true)});
document.addEventListener("visibilitychange",function(){if(document.hidden)flush(true)});
function allFoods(){return DB.concat(S.custom)}
/* Wpisy w dzienniku trzymają własną kopię wartości, więc zmiana produktu ich
   nie rusza — i to jest dobrze, bo dziennik jest zapisem tego, co było.
   Ale trzeba wiedzieć, ilu pozycji dotyczy zmiana, żeby móc o nią zapytać. */
/* Nazwa produktu jest zapamiętana w dwóch miejscach: w indeksie fraz (IDX)
   i w słowach do wyszukiwarki cache'owanych na samym produkcie (_sw). Oba
   przeliczają się dopiero, gdy zmieni się LICZBA własnych produktów — przy
   edycji liczba zostaje ta sama, więc trzeba je unieważnić wprost. Bez tego
   po zmianie nazwy produkt znika z wyszukiwarki: szuka się starej nazwy. */
function forgetFood(food){
  if(food)delete food._sw;
  IDX=null;
}
function entriesOf(fid){
  var out=[];
  for(var d in S.log)(S.log[d]||[]).forEach(function(e){if(e.fid===fid)out.push(e)});
  return out;
}
function byId(id){
  var a=allFoods();
  for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];
  return null;
}

/* ═══════════════════════ 4. logika ═══════════════════════ */
var day=dkey(new Date());
var view="today";
var undo=null,toastT=null;

function entries(k){return S.log[k]||[]}
function totals(k){
  var t={k:0,p:0,c:0,f:0};
  entries(k).forEach(function(e){t.k+=e.k;t.p+=e.p;t.c+=e.c;t.f+=e.f});
  return t;
}
/* ═══════════════════════ dni bez alkoholu ═══════════════════════
   Zwykły „streak” po pierwszej wpadce kasuje się do zera i udaje, że
   poprzednich czterdziestu dni nie było. To nieprawda i zniechęca, więc
   liczymy dwie rzeczy naraz: dni od ostatniego razu (ta motywuje) ORAZ
   czyste dni w ostatnich trzydziestu (tej jedna wpadka prawie nie rusza).

   Trzecia liczba jest tym, czego nie ma ani licznik trzeźwości, ani licznik
   kalorii: ile kalorii przez to NIE wypiłeś — licząc z Twojego własnego
   spożycia sprzed rzucenia, nie z jakiejś średniej krajowej. */
var ALKO={};
("piwo-jasne piwo-mocne-7 piwo-ipa piwo-pszeniczne piwo-ciemne radler cydr "+
 "wino-czerwone wino-biale wino-biale-polslodkie prosecco szampan "+
 "wodka-40 whisky rum gin gin-z-tonikiem tequila nalewka likier-kremowy "+
 "aperol-spritz mojito pina-colada").split(" ").forEach(function(w){if(w)ALKO[w]=1});

function alkoKcal(k){
  var sum=0;
  (S.log[k]||[]).forEach(function(e){if(ALKO[e.fid])sum+=e.k});
  return sum;
}
function alkoStats(){
  var today=dkey(new Date()), keys=Object.keys(S.log).sort();
  var last=null,lastE=null;
  keys.forEach(function(k){
    (S.log[k]||[]).forEach(function(e){
      if(ALKO[e.fid]&&(!last||k>=last)){last=k;lastE=e}
    });
  });
  if(!last)return {any:false};
  /* Dni od ostatniego kieliszka. Dzień, w którym piłeś, nie jest czysty. */
  var streak=Math.round((parseKey(today)-parseKey(last))/86400000);
  /* Trzydzieści dni wstecz: ile z nich było czystych. Jedna wpadka rusza tę
     liczbę o jeden, a nie o wszystko. */
  var clean=0,logged=0,strip=[];
  for(var i=29;i>=0;i--){
    var k=shiftKey(today,-i), has=(S.log[k]||[]).length>0, a=alkoKcal(k)>0;
    strip.push({d:k,logged:has,alko:a});
    if(has){logged++;if(!a)clean++}
  }
  /* Ile normalnie wypijałeś: średnia z 30 dni PRZED ostatnim razem, licząc
     tylko dni z zapisem — inaczej dzień bez wpisu udawałby dzień bez piwa. */
  var base=0,bd=0;
  for(i=0;i<30;i++){
    var kk=shiftKey(last,-i);
    if((S.log[kk]||[]).length){base+=alkoKcal(kk);bd++}
  }
  var perDay=bd?base/bd:0;
  return {any:true,streak:streak,last:last,lastName:lastE?lastE.n:"",lastG:lastE?lastE.g:0,
          clean:clean,logged:logged,strip:strip,perDay:perDay,
          saved:perDay*streak,kg:perDay*streak/KCAL_PER_KG};
}

/* ═══════════════ bank tygodnia i domykanie dnia ═══════════════
   Dzień to zły horyzont: nikt nie je równo, a fizjologicznie liczy się deficyt
   tygodniowy. Bank pokazuje, ile zostało zapasu z dni już zamkniętych — dzięki
   temu sobotnia kolacja przestaje być porażką, a staje się wydatkiem z konta.

   Dni BEZ ZAPISU są pomijane, a nie liczone jako pełny zapas: dzień, którego
   nie zapisałeś, to nie dzień, w którym nie jadłeś. To ta sama zasada, co przy
   liczeniu zapotrzebowania z wagi. */
function weekStart(k){
  var d=parseKey(k), dow=d.getDay();      /* 0 = niedziela */
  return shiftKey(k,-((dow+6)%7));        /* tydzień od poniedziałku */
}
function weekBank(k){
  var mon=weekStart(k), days=[], i, key;
  for(i=0;i<7;i++)days.push(shiftKey(mon,i));
  var idx=days.indexOf(k);
  var closed=[], bank=0, skipped=0;
  for(i=0;i<idx;i++){
    key=days[i];
    var eaten=totals(key).k;
    if(!entries(key).length){skipped++;continue}
    closed.push({d:key,eaten:eaten,diff:S.goal.k-eaten});
    bank+=S.goal.k-eaten;
  }
  var leftDays=7-idx;                     /* z dzisiejszym włącznie */
  return {days:days,from:mon,to:days[6],closed:closed,skipped:skipped,
          bank:Math.round(bank),leftDays:leftDays,
          perDay:Math.round(S.goal.k+bank/leftDays)};
}

/* Wieczorem zostaje budżet i luka w białku. Apka ma 655 produktów i zna oba te
   liczby, więc może to policzyć zamiast kazać zgadywać.

   Samo „białko na kalorię” to zły ranking — wygrywa nim kolagen i pół kilo
   krewetek. Podpowiedź musi być JEDZENIEM, więc liczy się też, czy porcja jest
   normalna, czy produkt bywa posiłkiem i czy Ty go w ogóle jadasz. */
var CLOSE_PRIOR={mieso:1,nabial:1,straczkowe:.9,gotowe:.65,zboza:.5,supl:.55,
                 tluszcze:.4,napoje:.35,warzywa:.3,owoce:.2,slodycze:.1,own:.9};
function closeDay(k){
  var t=totals(k), G=S.goal;
  var room=Math.round(G.k-t.k), need=Math.round(G.p-t.p);
  var out={room:room,need:need,picks:[]};
  if(room<80||need<8)return out;    /* nie ma czego domykać */
  var use=S.usage||{};
  allFoods().forEach(function(f){
    if(f.p<4)return;                /* nie proponujemy samych węgli */
    /* Ile trzeba, by domknąć lukę — ale nie więcej niż dwie porcje,
       bo podpowiedź „450 g krewetek” to nie podpowiedź. */
    var g=Math.min(f.s*2,Math.max(f.s*0.5,need*100/f.p));
    var m=scale(f,g);
    if(m.k>room){
      g=room*100/f.k;
      if(g<f.s*0.5)return;
      m=scale(f,g);
    }
    var step=(f.u==="g"||f.u==="ml")?10:Math.max(1,Math.round(f.s/2));
    g=Math.max(step,Math.round(g/step)*step);
    m=scale(f,g);
    if(m.k>room||m.p<8)return;
    var practical=1/(1+Math.abs(g/f.s-1));           /* porcja blisko domyślnej */
    var density=m.p/Math.max(1,m.k);                 /* białko na kalorię */
    var covers=Math.min(m.p,need)/need;              /* ile luki domyka */
    var known=Math.min((use[f.id]||{}).n||0,8)/8;    /* czy to jadasz */
    var prior=CLOSE_PRIOR[f.cat]||.5;
    out.picks.push({f:f,g:g,k:m.k,p:m.p,
      score:(density*300+covers*60)*practical*(0.7+0.3*prior)*(1+0.6*known)});
  });
  out.picks.sort(function(a,b){return b.score-a.score});
  /* Jeden produkt na kategorię — inaczej wychodzi pięć rodzajów twarogu. */
  var seen={},uniq=[];
  out.picks.forEach(function(x){
    if(seen[x.f.cat])return;
    seen[x.f.cat]=1;uniq.push(x);
  });
  out.picks=uniq.slice(0,4);
  return out;
}

function scale(food,g){
  var r=g/100;
  return {k:food.k*r,p:food.p*r,c:food.c*r,f:food.f*r};
}
/* ═══════════════════ waga: trend i realne zapotrzebowanie ═══════════════════
   Wzór Mifflina daje zapotrzebowanie statystycznego człowieka o Twoich
   wymiarach, a mnożnik aktywności zgadujesz sam. To można zmierzyć zamiast
   zgadywać: przy znanym spożyciu tempo zmiany wagi mówi, ile realnie spalasz.

       zapotrzebowanie = średnie spożycie − (zmiana wagi × 7700 kcal/kg)

   7700 kcal na kilogram to przyjęta wartość dla tkanki tłuszczowej. Dzienna
   waga skacze o 1–2 kg od wody i zawartości jelit, więc tempo bierzemy
   z regresji liniowej po wszystkich pomiarach, a nie z odejmowania dwóch. */
var KCAL_PER_KG=7700, WT_WINDOW=28;

function wtDays(){
  var out=[];
  for(var k in S.wt){var v=+S.wt[k];if(isFinite(v)&&v>0)out.push({d:k,w:v})}
  out.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  return out;
}
function dayNum(k){var p=k.split("-");return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000)}
function lastWeight(){var a=wtDays();return a.length?a[a.length-1].w:null}

/* Prosta regresja: nachylenie w kg/dobę i wygładzona waga na dziś. */
function wtFit(win){
  var all=wtDays();
  if(!all.length)return null;
  var end=dayNum(all[all.length-1].d);
  var pts=all.filter(function(x){return end-dayNum(x.d)<win});
  if(pts.length<2)return {n:pts.length,span:0,slope:0,now:pts.length?pts[0].w:null};
  var xs=pts.map(function(x){return dayNum(x.d)}),ys=pts.map(function(x){return x.w});
  var mx=xs.reduce(function(a,b){return a+b},0)/xs.length;
  var my=ys.reduce(function(a,b){return a+b},0)/ys.length;
  var num=0,den=0;
  for(var i=0;i<xs.length;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)*(xs[i]-mx)}
  var slope=den?num/den:0;
  return {n:pts.length,span:xs[xs.length-1]-xs[0]+1,slope:slope,
          now:my+slope*(xs[xs.length-1]-mx),from:xs[0],to:xs[xs.length-1]};
}

/* Ile realnie spalasz — albo czego jeszcze brakuje, żeby to policzyć.
   Największym źródłem błędu nie jest waga, tylko niezapisane dni: średnia
   z połowy dni to nie średnie spożycie. Dlatego wymagamy pokrycia. */
function tdeeReal(){
  var f=wtFit(WT_WINDOW);
  if(!f||f.n<3)return {ok:false,why:"wagi",need:3-((f&&f.n)||0),fit:f};
  if(f.span<14)return {ok:false,why:"czas",need:14-f.span,fit:f};
  var kcal=[],miss=0;
  for(var d=f.from;d<=f.to;d++){
    var key=dkey(new Date(d*86400000));
    var es=S.log[key]||[];
    var sum=es.reduce(function(a,e){return a+e.k},0);
    if(sum>500)kcal.push(sum); else miss++;
  }
  var span=f.to-f.from+1;
  if(kcal.length<Math.ceil(span*0.7))
    return {ok:false,why:"dni",need:Math.ceil(span*0.7)-kcal.length,fit:f,logged:kcal.length,span:span};
  var mean=kcal.reduce(function(a,b){return a+b},0)/kcal.length;
  return {ok:true,fit:f,mean:Math.round(mean),logged:kcal.length,span:span,miss:miss,
          tdee:Math.round((mean-f.slope*KCAL_PER_KG)/10)*10};
}
function kgWeek(slope){return Math.round(slope*7*100)/100}

var SLOTS=["Śniadanie","Obiad","Kolacja","Przekąska"];
function slot(ts){
  var h=new Date(ts).getHours();
  if(h>=4&&h<11)return "Śniadanie";
  if(h>=11&&h<16)return "Obiad";
  if(h>=16&&h<21)return "Kolacja";
  return "Przekąska";
}
/* posiłek podany wprost ("na śniadanie") bije zgadywanie z godziny */
function slotOf(e){return e.sl||slot(e.t)}
function pieceWeight(food){return food.pc||food.s}
function bump(id){var u=S.usage[id]||{n:0,last:0};u.n++;u.last=Date.now();S.usage[id]=u}
/* Jednostki domowe odmieniają się: „2 łyżki”, nie „2 łyżka”. Kolumny to
   liczba pojedyncza, 2–4, 5 i więcej, oraz dopełniacz dla ułamków („½ łyżki”). */
var UNITF={
  "szt":       ["szt","szt","szt","szt"],
  "kromka":    ["kromka","kromki","kromek","kromki"],
  "garść":     ["garść","garście","garści","garści"],
  "łyżka":     ["łyżka","łyżki","łyżek","łyżki"],
  "łyżeczka":  ["łyżeczka","łyżeczki","łyżeczek","łyżeczki"],
  "porcja":    ["porcja","porcje","porcji","porcji"],
  "miarka":    ["miarka","miarki","miarek","miarki"],
  "ząbek":     ["ząbek","ząbki","ząbków","ząbka"]
};
function unitWord(u,q){
  var f=UNITF[u];
  if(!f)return u;
  if(q!==Math.round(q))return f[3];          /* ułamek → dopełniacz */
  var n=Math.abs(Math.round(q));
  if(n===1)return f[0];
  if(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))return f[1];
  return f[2];
}
function unitLabel(food,g){
  if(food.u==="g"||food.u==="ml")return fmt(g)+" "+food.u;
  var q=g/food.s, s=q===1?"1":(Math.abs(q-0.5)<0.01?"½":(Math.abs(q-1.5)<0.01?"1½":String(Math.round(q*10)/10).replace(".",",")));
  return s+" "+unitWord(food.u,q)+" · "+fmt(g)+" g";
}
function addLabel(food){
  if(food.u==="g"||food.u==="ml")return fmt(food.s)+" "+food.u;
  return "1 "+unitWord(food.u,1);
}
function pushEntry(dk,food,g,sl,tOff){
  var m=scale(food,g);
  var e={fid:food.id,n:food.n,g:g,u:food.u,s:food.s,k:m.k,p:m.p,c:m.c,f:m.f,t:Date.now()+(tOff||0)};
  if(sl)e.sl=sl;
  if(!S.log[dk])S.log[dk]=[];
  S.log[dk].push(e);
  bump(food.id);
  return e;
}
function addEntry(food,g,silent,sl){
  var e=pushEntry(day,food,g,sl);
  save();
  if(!silent){
    undo=function(){var a=S.log[day];var i=a.indexOf(e);if(i>-1)a.splice(i,1);save();render()};
    toast(food.n+" · "+fmt(e.k)+" kcal","Cofnij",undo);
  }
  return e;
}
function delEntry(e){
  var a=S.log[day],i=a.indexOf(e);
  if(i<0)return;
  a.splice(i,1);save();
  toast("Usunięto "+e.n,"Cofnij",function(){a.splice(Math.min(i,a.length),0,e);save();render()});
  render();
}
function ranked(){
  var out=allFoods().filter(function(f){return S.usage[f.id]});
  out.sort(function(a,b){
    var ua=S.usage[a.id],ub=S.usage[b.id];
    return (ub.n-ua.n)||(ub.last-ua.last);
  });
  return out;
}
/* Liczba w stepperze jako pole do wpisania. Jeden komponent dla wszystkich
   pięciu miejsc, w których apka pyta o liczbę — inaczej każdy ekran zachowywałby
   się trochę inaczej, a to widać w użyciu.
     dec  — czy dopuszczamy ułamek (waga tak, gramatura nie)
     min/max — twarde granice; przy wpisywaniu ograniczamy wartość, ale nie
     przepisujemy tekstu pod palcami — porządkujemy go po wyjściu z pola. */
function numBox(o){
  /* Cyfry tabularne, żeby liczba nie „skakała” przy zmianie wartości. */
  var inp=el("input",{type:"text",class:"num",inputmode:o.dec?"decimal":"numeric",
    autocomplete:"off","aria-label":o.label||"Wartość"});
  var uni=o.unit?el("s",{text:o.unit}):null;
  var box=el("div",{class:o.cls||"val"},uni?[inp,uni]:[inp]);
  var cur=o.value;
  function clamp(v){
    if(o.min!=null&&v<o.min)v=o.min;
    if(o.max!=null&&v>o.max)v=o.max;
    return o.dec?Math.round(v*10)/10:Math.round(v);
  }
  function show(){inp.value=o.dec?cur.toFixed(1).replace(".",","):String(cur)}
  inp.addEventListener("input",function(){
    var raw=String(inp.value).replace(",",".");
    var v=parseFloat(raw);
    if(!isFinite(v))return;      /* pole w trakcie pisania bywa puste */
    cur=clamp(v);
    if(o.onChange)o.onChange(cur);
  });
  inp.addEventListener("blur",show);
  inp.addEventListener("focus",function(){inp.select()});
  show();
  return {el:box,input:inp,
    get:function(){return cur},
    set:function(v,unit){cur=clamp(v);show();if(uni&&unit!=null)uni.textContent=unit},
    unit:function(u){if(uni)uni.textContent=u}};
}

function toast(msg,actLbl,act){
  var t=document.getElementById("toast");
  t.innerHTML="";
  t.appendChild(el("span",{class:"tx",text:msg}));
  if(actLbl)t.appendChild(el("button",{text:actLbl,onclick:function(){act();hideToast()}}));
  t.classList.add("on");
  clearTimeout(toastT);
  toastT=setTimeout(hideToast,4200);
}
function hideToast(){document.getElementById("toast").classList.remove("on")}

/* ═══════════════════════ 5. arkusz (bottom sheet) ═══════════════════════ */
var sheetEl=document.getElementById("sheet"),scrimEl=document.getElementById("scrim");
function openSheet(build){
  sheetEl.innerHTML="";
  sheetEl.appendChild(el("div",{class:"grab"}));
  build(sheetEl);
  sheetEl.classList.add("on");scrimEl.classList.add("on");
}
function closeSheet(){
  if(DICT){DICT.stop();DICT=null}
  sheetEl.classList.remove("on");scrimEl.classList.remove("on");
}
scrimEl.addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});

function portionSheet(food,opts){
  opts=opts||{};
  var g=opts.g||food.s;
  openSheet(function(root){
    var pv,pvm;
    /* Gramaturę można wpisać z klawiatury albo dojechać plusem — to samo pole. */
    var gBox=numBox({value:g,unit:food.u==="ml"?"ml":"g",min:1,max:5000,label:"Ilość w gramach",
      onChange:function(v){g=v;upd();paint()}});
    function upd(){
      var m=scale(food,g);
      pv.innerHTML="";
      pv.appendChild(el("span",{class:"v num",text:fmt(m.k)}));
      pv.appendChild(el("span",{class:"u",text:"kcal · "+unitLabel(food,g)}));
      pvm.innerHTML="";
      [["B",m.p,"var(--p)"],["W",m.c,"var(--c)"],["T",m.f,"var(--f)"]].forEach(function(x){
        pvm.appendChild(el("span",{html:'<span style="color:'+x[2]+';font-weight:700">'+x[0]+'</span> <i class="num">'+fmt(x[1])+" g</i>"}));
      });
      if(gBox.get()!==g)gBox.set(g);
    }
    root.appendChild(el("h3",{id:"sheetTitle",text:food.n}));
    root.appendChild(el("div",{class:"per",text:"100 g = "+fmt(food.k)+" kcal · B "+food.p+" · W "+food.c+" · T "+food.f}));
    pv=el("div",{class:"preview"});root.appendChild(pv);
    pvm=el("div",{class:"pvmac"});root.appendChild(pvm);

    /* Dania nabiera się łyżką z miski, a nie liczy w porcjach — przy sałatce na
       imprezie „½ porcji” nic nie znaczy, a „trzy łyżki” znaczy. Dla dań dajemy
       więc wybór w mowie potocznej; gramy i tak są widoczne w podglądzie. */
    var eye=food.u==="porcja";
    var chips=el("div",{class:"seg"});
    var quick=[];
    if(eye){
      var sp=spoonGrams(food);
      /* Cztery, nie pięć: piąta etykieta nie mieszcza się w szerokości ekranu,
         a cała porcja jest i tak wartością domyślną przy otwarciu arkusza. */
      quick=[["łyżka",Math.round(sp)],["2 łyżki",Math.round(sp*2)],["3 łyżki",Math.round(sp*3)],
             ["talerzyk",Math.round(food.s*0.7)]];
    }else{
      var mults=(food.u==="g"||food.u==="ml")?[0.5,1,1.5,2]:[0.5,1,1.5,2,3];
      quick=mults.map(function(m){
        var gg=Math.round(food.s*m);
        return [(food.u==="g"||food.u==="ml")?fmt(gg)+" "+food.u
          :(m===0.5?"½":m===1.5?"1½":String(m))+" "+unitWord(food.u,m),gg];
      });
    }
    quick.forEach(function(o){
      chips.appendChild(el("button",{text:o[0],onclick:function(){g=o[1];upd();paint()}}));
    });
    function paint(){
      [].forEach.call(chips.children,function(b,i){
        b.setAttribute("aria-pressed",quick[i][1]===g?"true":"false");
      });
    }
    root.appendChild(eye?el("div",{class:"field"},[el("label",{text:"Na oko"}),chips]):chips);

    var step=el("div",{class:"stepper"},[
      el("button",{text:"−","aria-label":"Mniej",onclick:function(){g=Math.max(1,g-(g>60?10:5));upd();paint()}}),
      gBox.el,
      el("button",{text:"+","aria-label":"Więcej",onclick:function(){g=g+(g>=60?10:5);upd();paint()}})
    ]);
    root.appendChild(el("div",{class:"field"},[el("label",{text:"Ilość w gramach"}),step]));

    /* Posiłek jest zgadywany z godziny, więc musi być jak go zmienić — i to
       zarówno przy poprawianiu wpisu, jak i przy dodawaniu. Zgadywanie bywa
       nietrafione dokładnie w tych porach, w których i tak się je: kanapka
       o 15:00 to nadal może być śniadanie. */
    var pickedSlot=opts.entry?slotOf(opts.entry):slot(Date.now());
    var slotSeg=el("div",{class:"seg"});
    var paintSlot=function(){
      [].forEach.call(slotSeg.children,function(b){
        b.setAttribute("aria-pressed",b.textContent===pickedSlot?"true":"false");
      });
    };
    SLOTS.forEach(function(sn){
      slotSeg.appendChild(el("button",{text:sn,onclick:function(){pickedSlot=sn;paintSlot()}}));
    });
    paintSlot();
    root.appendChild(el("div",{class:"field"},[el("label",{text:"Posiłek"}),slotSeg]));

    var row=el("div",{class:"sheetrow"});
    if(opts.entry){
      row.appendChild(el("button",{class:"btn danger",text:"Usuń",onclick:function(){closeSheet();delEntry(opts.entry)}}));
      row.appendChild(el("button",{class:"btn",text:"Zapisz",onclick:function(){
        var m=scale(food,g);
        opts.entry.g=g;opts.entry.k=m.k;opts.entry.p=m.p;opts.entry.c=m.c;opts.entry.f=m.f;
        opts.entry.sl=pickedSlot;
        saveNow();closeSheet();render();
      }}));
    }else{
      row.appendChild(el("button",{class:"btn alt",text:"Anuluj",onclick:closeSheet}));
      row.appendChild(el("button",{class:"btn",text:"Dodaj",onclick:function(){
        closeSheet();addEntry(food,g,false,pickedSlot);render();
      }}));
    }
    root.appendChild(row);
    upd();paint();
  });
}

/* Waga zmienia się o grosze na dobę, więc wpisywanie jej z klawiatury to
   marnotrawstwo: startujemy od ostatniego pomiaru i dojeżdżamy plusem. */
function weightSheet(){
  var d=day, cur=S.wt[d]!=null?+S.wt[d]:(lastWeight()||(S.profile&&S.profile.w)||75);
  openSheet(function(root){
    /* Waga ma ułamek — 81,4 wpisuje się szybciej niż dojeżdża. */
    var box=numBox({value:cur,unit:"kg",min:25,max:300,dec:true,label:"Waga w kilogramach",
      onChange:function(x){cur=x}});
    function nudge(x){cur=Math.round(Math.min(300,Math.max(25,cur+x))*10)/10;box.set(cur)}
    root.appendChild(el("h3",{id:"sheetTitle",text:"Waga"}));
    root.appendChild(el("div",{class:"per",text:
      new Date(d+"T12:00:00").toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"})+
      " · najlepiej rano, po toalecie, przed jedzeniem"}));
    root.appendChild(el("div",{class:"field"},[el("label",{text:"Pomiar"}),
      el("div",{class:"stepper"},[
        el("button",{text:"−","aria-label":"Mniej",onclick:function(){nudge(-0.1)}}),
        box.el,
        el("button",{text:"+","aria-label":"Więcej",onclick:function(){nudge(0.1)}})
      ])]));
    var jump=el("div",{class:"seg"});
    [-1,-0.5,0.5,1].forEach(function(x){
      jump.appendChild(el("button",{text:(x>0?"+":"−")+String(Math.abs(x)).replace(".",","),
        onclick:function(){nudge(x)}}));
    });
    root.appendChild(el("div",{class:"field"},[el("label",{text:"Skok"}),jump]));
    var row=el("div",{class:"sheetrow"});
    if(S.wt[d]!=null){
      row.appendChild(el("button",{class:"btn danger",text:"Usuń pomiar",onclick:function(){
        delete S.wt[d];syncProfileWeight();saveNow();closeSheet();render();toast("Pomiar usunięty");
      }}));
    }else{
      row.appendChild(el("button",{class:"btn alt",text:"Anuluj",onclick:closeSheet}));
    }
    row.appendChild(el("button",{class:"btn",text:"Zapisz",onclick:function(){
      S.wt[d]=cur;syncProfileWeight();saveNow();closeSheet();render();
      toast("Waga zapisana: "+cur.toFixed(1).replace(".",",")+" kg");
    }}));
    root.appendChild(row);
  });
}
/* Waga w kalkulatorze musi iść za pomiarem, inaczej wzór liczy z liczby
   wpisanej kiedyś ręcznie i cicho się rozjeżdża z rzeczywistością. */
function syncProfileWeight(){
  var nw=lastWeight();
  if(S.profile&&nw!=null)S.profile.w=nw;
}

/* Pokazujemy tylko wtedy, gdy w historii W OGÓLE jest alkohol — kto nigdy go
   nie zapisał, nie ma po co oglądać licznika. Historia zostaje na zawsze, więc

   najbardziej potrzebny. */

}

    ]));

/* Jedna linijka na ekranie Dziś. Trend jest ważniejszy niż sam pomiar:
   pomiar skacze od wody i jedzenia, trend pokazuje kierunek. */
function weightRow(){
  var f=wtFit(WT_WINDOW), here=S.wt[day];
  var kids=[el("span",{class:"ic"},[svg(ICON.scale)])];
  if(here==null&&!f){
    kids.push(el("span",{class:"tx"},[
      el("b",{text:"Dodaj wagę"}),
      el("s",{text:"kilka pomiarów i cel policzy się z Twoich danych, nie ze wzoru"})
    ]));
  }else{
    var sub=[];
    if(here==null)sub.push("dziś bez pomiaru");
    if(f&&f.n>=2){
      var kw=kgWeek(f.slope);
      sub.push("trend "+f.now.toFixed(1).replace(".",",")+" kg");
      sub.push((kw>0?"+":kw<0?"−":"±")+Math.abs(kw).toFixed(2).replace(".",",")+" kg/tyg");
    }else{
      sub.push("jeden pomiar — trend liczy się od dwóch");
    }
    kids.push(el("span",{class:"tx"},[
      el("b",{text:"Waga · "+(here!=null?(+here).toFixed(1).replace(".",",")+" kg":"—")}),

     treść kleiła się do krawędzi. */
  return el("button",{class:"nlcard",onclick:weightSheet},[el("span",{class:"wtrow"},kids)]);
}

/* Bank bez rozpisania na dni to liczba wzięta z powietrza — arkusz pokazuje,
   skąd się wzięła, i które dni zostały pominięte. */
function weekSheet(wb){
  openSheet(function(root){
    root.appendChild(el("h3",{id:"sheetTitle",text:"Ten tydzień"}));
    root.appendChild(el("div",{class:"per",text:
      "Od poniedziałku. Liczą się tylko dni z zapisem — dzień, którego nie "+
      "zapisałeś, to nie dzień, w którym nie jadłeś."}));
    wb.days.forEach(function(k,i){
      var has=entries(k).length, eaten=totals(k).k, diff=S.goal.k-eaten;
      var isDay=k===day, future=k>dkey(new Date());
      var right=has?(diff>=0?"+":"−")+fmt(Math.abs(diff)):(future?"—":"bez zapisu");
      root.appendChild(el("div",{class:"nlrow"},[
        el("span",{class:"n"},[
          el("b",{text:DOW[parseKey(k).getDay()]+(isDay?" · ten dzień":"")}),
          el("s",{text:has?fmt(eaten)+" z "+fmt(S.goal.k)+" kcal":"—"})
        ]),
        el("span",{class:"kc num",style:has?(diff>=0?"":"color:var(--over)"):"color:var(--ink-3);font-weight:500",
          text:right})
      ]));
    });
    root.appendChild(el("div",{class:"note",html:
      "Bilans: <b class='num'>"+(wb.bank>=0?"+":"−")+fmt(Math.abs(wb.bank))+"</b> kcal. "+
      "Zostały "+wb.leftDays+" "+plural(wb.leftDays,"dzień","dni","dni")+
      ", czyli po <b class='num'>"+fmt(wb.perDay)+"</b> kcal, jeśli chcesz to rozłożyć równo."+
      (wb.skipped?" Dni bez zapisu pominięte: "+wb.skipped+".":"")}));
    root.appendChild(el("div",{class:"sheetrow"},[
      el("button",{class:"btn",text:"Rozumiem",onclick:closeSheet})
    ]));
  });
}
