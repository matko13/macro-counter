/* ═══════════════════════ 6. widok: Dziś ═══════════════════════ */
function viewToday(){
  var wrap=document.createDocumentFragment();
  var t=totals(day),G=S.goal;

  /* przesuwanie dni */
  var isToday=day===dkey(new Date());
  wrap.appendChild(el("div",{class:"shuttle"},[
    el("div",{},[
      el("h2",{text:dayTitle(day)}),
      el("div",{class:"dow",text:DOW[parseKey(day).getDay()]+", "+parseKey(day).getDate()+" "+MON[parseKey(day).getMonth()]})
    ]),
    el("div",{class:"nav"},[
      el("button",{"aria-label":"Poprzedni dzień",onclick:function(){day=shiftKey(day,-1);render()}},[svg(ICON.left)]),
      el("button",{"aria-label":"Następny dzień",disabled:isToday?"":null,onclick:function(){day=shiftKey(day,1);render()}},[svg(ICON.right)])
    ])
  ]));

  /* odczyt jak z wagi */
  var left=G.k-t.k, over=left<0;
  var pct=G.k?Math.min(100,t.k/G.k*100):0;
  var gauge=el("div",{class:"gauge"+(over?" over":"")},[el("div",{class:"fill"})]);
  gauge.firstChild.style.width=pct+"%";

  var readout=el("div",{class:"readout"+(over?" over":"")},[
    el("div",{class:"bignum"},[
      el("span",{class:"v num",text:fmt(Math.abs(left))}),
      el("span",{class:"u",text:"kcal"}),
      el("span",{class:"cap",text:over?"ponad cel":"do celu"})
    ]),
    el("div",{class:"sub",html:"<b class='num'>"+fmt(t.k)+"</b> z <b class='num'>"+fmt(G.k)+"</b> kcal"+(entries(day).length?" · "+entries(day).length+" "+plural(entries(day).length,"pozycja","pozycje","pozycji"):"")}),
    gauge
  ]);
  /* Dzień to zły horyzont — liczy się bilans tygodnia. */
  var wb=weekBank(day);
  if(wb.closed.length){
    var plus=wb.bank>=0;
    readout.appendChild(el("button",{class:"wkbank",onclick:function(){weekSheet(wb)}},[
      el("span",{html:"Ten tydzień: <b>"+(plus?"+":"−")+fmt(Math.abs(wb.bank))+" kcal</b> "+
        (plus?"zapasu":"do odrobienia")+" z "+wb.closed.length+" "+
        plural(wb.closed.length,"zamkniętego dnia","zamkniętych dni","zamkniętych dni")}),
      el("span",{class:"go"},[svg(ICON.right)])
    ]));
  }
  wrap.appendChild(readout);

  /* makro */
  var mac=el("div",{class:"macros"});
  [["Białko","p","--p"],["Węglowodany","c","--c"],["Tłuszcz","f","--f"]].forEach(function(x){
    var have=t[x[1]],goal=G[x[1]];
    var w=goal?Math.min(100,have/goal*100):0;
    var spill=goal&&have>goal?Math.min(100-w,(have-goal)/goal*100):0;
    var track=el("div",{class:"track"});
    var bar=el("div",{class:"bar"});bar.style.width=w+"%";track.appendChild(bar);
    if(spill>0){var sp=el("div",{class:"bar spill"});sp.style.width=spill+"%";track.appendChild(sp)}
    var row=el("div",{class:"macro"},[
      el("div",{class:"k"},[el("span",{class:"dot"}),el("span",{text:x[0]})]),
      el("div",{class:"v",html:"<b class='num'>"+fmt(have)+"</b> / <span class='num'>"+fmt(goal)+"</span> g"}),
      track
    ]);
    row.style.setProperty("--hue","var("+x[2]+")");
    mac.appendChild(row);
  });
  readout.appendChild(mac);

  wrap.appendChild(nlCard());
  /* Pokazujemy dopiero, gdy dzień jest w toku i naprawdę jest co domykać: rano
     cały dzień jest „luką”, a lista produktów wysokobiałkowych o ósmej to szum.
     Progiem nie jest godzina (dawny dzień też da się oglądać), tylko dwa posiłki
     za sobą: co najmniej trzy pozycje i zjedzone 30% budżetu. Po obiedzie
     planowanie reszty dnia ma sens, po samym śniadaniu jeszcze nie. */
  var cd=closeDay(day);
  if(entries(day).length>=3&&cd.picks.length&&cd.need>=15&&cd.room<=G.k*0.7){
    var box=el("div",{class:"closer"},[
      el("div",{class:"hd"},[
        el("b",{text:"Czym domknąć dzień"}),
        el("s",{text:"zostało "+fmt(cd.room)+" kcal i "+fmt(cd.need)+" g białka"})
      ])
    ]);
    cd.picks.forEach(function(x){
      box.appendChild(el("button",{class:"opt",onclick:function(){
        portionSheet(x.f,{g:x.g});
      }},[
        el("span",{class:"n"},[
          el("span",{text:x.f.n}),
          el("s",{text:unitLabel(x.f,x.g)+" · B "+fmt(x.p)+" g"})
        ]),
        el("span",{class:"kc num",text:fmt(x.k)+" kcal"})
      ]));
    });
    wrap.appendChild(box);
  }
  wrap.appendChild(weightRow());
  wrap.appendChild(alkoRow());
  /* Powtórzenie wczorajszego dnia siedziało w pasku „najczęstszych”, którego
     tu już nie ma. Zostaje jako pojedynczy przycisk, bo to inna funkcja niż
     lista produktów — a druga jego kopia jest na ekranie Zestawy. */
  var y=shiftKey(day,-1);
  if(entries(y).length&&!entries(day).length){
    wrap.appendChild(el("button",{class:"btn alt",text:"↺ Powtórz wczoraj",
      onclick:function(){copyDay(y)}}));
  }

  /* wykres 7 dni */
  wrap.appendChild(weekStrip());

  /* log dnia */
  var es=entries(day).slice().sort(function(a,b){return a.t-b.t});
  var sec=el("div",{class:"sec"});
  sec.appendChild(el("div",{class:"sechead"},[el("h3",{text:"Zjedzone"})]));
  if(!es.length){
    sec.appendChild(el("div",{class:"empty",text:"Nic jeszcze nie zapisane. Tapnij coś powyżej albo wejdź w „Dodaj”."}));
  }else{
    var groups={},order=[];
    es.forEach(function(e){var s=slotOf(e);if(!groups[s]){groups[s]=[];order.push(s)}groups[s].push(e)});
    SLOTS.forEach(function(sname){
      if(!groups[sname])return;
      var list=groups[sname];
      var gk=list.reduce(function(a,e){return a+e.k},0);
      var g=el("div",{class:"group"});
      g.appendChild(el("div",{class:"grouphead"},[
        el("span",{class:"t",text:sname}),
        el("span",{class:"k num",text:fmt(gk)+" kcal"}),
        el("button",{class:"save",text:"zapisz zestaw",onclick:function(){saveSet(sname,list)}})
      ]));
      list.forEach(function(e){
        var f=byId(e.fid);
        g.appendChild(el("button",{class:"entry",onclick:function(){
          if(f)portionSheet(f,{g:e.g,entry:e});
          else delEntry(e);
        }},[
          el("span",{class:"n"},[
            el("b",{text:e.n}),
            el("s",{text:(f?unitLabel(f,e.g):fmt(e.g)+" g")})
          ]),
          el("span",{class:"macrodots",html:"<i style='color:var(--p)'>B "+fmt(e.p)+"</i><i style='color:var(--c)'>W "+fmt(e.c)+"</i><i style='color:var(--f)'>T "+fmt(e.f)+"</i>"}),
          el("span",{class:"kc num",html:fmt(e.k)+"<s>kcal</s>"})
        ]));
      });
      sec.appendChild(g);
    });
  }
  wrap.appendChild(sec);
  return wrap;
}
function plural(n,one,few,many){
  if(n===1)return one;
  var m=n%10, h=n%100;
  if(m>=2&&m<=4&&!(h>=12&&h<=14))return few;
  return many;
}

/* pasek 7 dni — jedna seria, jeden odcień; kolor statusu tylko dla przekroczenia celu */
function weekStrip(){
  var days=[];
  for(var i=6;i>=0;i--)days.push(shiftKey(day,-i));
  var vals=days.map(function(k){return totals(k).k});
  var goal=S.goal.k||2000;
  var max=Math.max(goal*1.15,Math.max.apply(null,vals)*1.05,1);
  var strip=el("div",{class:"week"});
  var gl=el("div",{class:"goal"},[el("span",{text:"cel "+fmt(goal)})]);
  gl.style.bottom=(goal/max*100)+"%";
  strip.appendChild(el("div",{class:"band"},[gl]));
  var cols=el("div",{class:"cols"});
  strip.appendChild(cols);
  days.forEach(function(k,i){
    var v=vals[i], over=v>goal, empty=v===0;
    var d=parseKey(k);
    var col=el("button",{
      class:"day"+(over?" over":"")+(empty?" nodata":"")+(k===day?" now":""),
      role:"img",
      "aria-label":DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+": "+fmt(v)+" kcal, cel "+fmt(goal)+" kcal",
      title:dayTitle(k)+" · "+fmt(v)+" kcal",
      onclick:function(){day=k;render();window.scrollTo({top:0,behavior:"smooth"})}
    });
    var bar=el("span",{class:"bar"});
    bar.style.height=Math.max(2,v/max*100)+"%";
    col.appendChild(el("span",{class:"plot"},[bar]));
    col.appendChild(el("span",{class:"lbl",text:DOW1[d.getDay()]}));
    cols.appendChild(col);
  });
  var sum=vals.reduce(function(a,b){return a+b},0);
  var logged=vals.filter(function(v){return v>0}).length;
  return el("div",{class:"sec weekwrap"},[
    el("div",{class:"sechead"},[el("h3",{text:"Ostatnie 7 dni"})]),
    strip,
    el("div",{class:"wkfoot"},[
      el("span",{html:"średnia z zapisanych dni: <b class='num'>"+fmt(logged?sum/logged:0)+"</b> kcal"}),
      el("span",{class:"num",text:logged+"/7"})
    ])
  ]);
}

function copyDay(from){
  var src=entries(from);
  if(!src.length)return;
  if(!S.log[day])S.log[day]=[];
  var added=[];
  src.forEach(function(e){
    var copy={};for(var k in e)copy[k]=e[k];
    copy.t=Date.now()+added.length;
    S.log[day].push(copy);added.push(copy);
    bump(e.fid);
  });
  save();render();
  toast("Skopiowano "+added.length+" "+plural(added.length,"pozycję","pozycje","pozycji"),"Cofnij",function(){
    S.log[day]=S.log[day].filter(function(e){return added.indexOf(e)<0});save();render();
  });
}
function saveSet(name,list){
  promptSheet("Zapisz zestaw","Nazwa",name+" "+parseKey(day).getDate()+"."+(parseKey(day).getMonth()+1),function(v){
    S.sets.push({id:"s"+Date.now(),n:v,items:list.map(function(e){return {fid:e.fid,n:e.n,g:e.g,k:e.k,p:e.p,c:e.c,f:e.f,u:e.u,s:e.s,sl:e.sl}})});
    save();toast("Zestaw „"+v+"” zapisany");render();
  });
}

/* ═══════════════════════ 7. widok: Dodaj ═══════════════════════ */
var q="",activeCat="all";
function viewAdd(){
  var wrap=document.createDocumentFragment();
  wrap.appendChild(el("h2",{text:"Dodaj jedzenie"}));
  wrap.appendChild(nlCard());
  wrap.appendChild(el("div",{class:"eyebrow",text:"albo pojedynczy produkt"}));

  var inp=el("input",{type:"search",placeholder:"Szukaj — np. jajko, ryż, banan",value:q,autocomplete:"off",
    oninput:function(){q=this.value;repaintList()}});
  var srch=el("div",{class:"search"},[svg(ICON.search),inp]);
  if(q)srch.appendChild(el("button",{class:"clear","aria-label":"Wyczyść",onclick:function(){q="";render();}},[svg(ICON.x)]));
  wrap.appendChild(srch);

  var cats=el("div",{class:"cats"});
  var list=[["all","Wszystko"]];
  if(ranked().length)list.push(["mine","Twoje"]);
  if(S.custom.length)list.push(["own","Własne"]);
  for(var c in CATS)list.push([c,CATS[c]]);
  list.forEach(function(x){
    cats.appendChild(el("button",{class:"cat",text:x[1],"aria-pressed":activeCat===x[0]?"true":"false",
      onclick:function(){activeCat=x[0];render()}}));
  });
  wrap.appendChild(cats);

  var holder=el("div",{});
  wrap.appendChild(holder);
  function repaintList(){
    holder.innerHTML="";
    var nq=norm(q.trim()),src;
    if(activeCat==="mine")src=ranked();
    else if(activeCat==="own")src=S.custom;
    else if(activeCat==="all")src=ranked().concat(allFoods().filter(function(f){return !S.usage[f.id]}));
    else src=allFoods().filter(function(f){return f.cat===activeCat});
    if(nq){
      var qt=nq.split(/\s+/).filter(Boolean),starts=[],has=[];
      src.forEach(function(f){
        if(!searchHit(f,qt))return;
        (norm(f.n).indexOf(qt[0])===0?starts:has).push(f);
      });
      src=starts.concat(has);
    }
    var seen={};
    src=src.filter(function(f){if(seen[f.id])return false;seen[f.id]=1;return true});
    if(!src.length){
      holder.appendChild(el("div",{class:"empty",text:q?"Nie mam „"+q.trim()+"” w bazie.":"Pusto tutaj."}));
      if(q.trim())holder.appendChild(el("button",{class:"btn",text:"Dodaj „"+q.trim()+"” jako własny produkt",
        onclick:function(){customSheet({name:q.trim()})}}));
    }
    src.slice(0,q?40:200).forEach(function(f){
      var m=scale(f,f.s);
      holder.appendChild(el("div",{class:"food"},[
        el("button",{class:"body",onclick:function(){portionSheet(f)}},[
          el("b",{text:f.n}),
          el("s",{class:"num",text:addLabel(f)+" · "+fmt(m.k)+" kcal · B "+fmt(m.p)+" W "+fmt(m.c)+" T "+fmt(m.f)})
        ]),
        f.own?el("button",{class:"edit","aria-label":"Popraw albo usuń "+f.n,
          onclick:function(){customSheet({edit:f})}},[svg(ICON.pen)]):null,
        el("button",{class:"addbtn","aria-label":"Dodaj "+f.n,onclick:function(){addEntry(f,f.s);renderChrome()}},[
          svg(ICON.plus),el("span",{class:"num",text:addLabel(f)})
        ])
      ].filter(Boolean)));
    });
    holder.appendChild(el("button",{class:"btn alt",style:"margin-top:16px",text:"+ Dodaj własny produkt",onclick:function(){customSheet()}}));
  }
  repaintList();
  return wrap;
}
/* Usuwanie własnego produktu. Historia zostaje: wpisy w dzienniku i zestawy
   trzymają własną kopię wartości, więc kasowanie produktu z bazy nie przepisuje
   przeszłości — znika tylko z listy do dodawania. */
function deleteCustom(food){
  var hits=entriesOf(food.id).length;
  openSheet(function(root){
    root.appendChild(el("h3",{id:"sheetTitle",text:"Usunąć „"+food.n+"”?"}));
    root.appendChild(el("div",{class:"per",text:hits
      ? "Zniknie z listy produktów. "+hits+" "+plural(hits,"zapisana pozycja","zapisane pozycje","zapisanych pozycji")+
        " w dzienniku "+(hits===1?"zostaje":"zostają")+" bez zmian — dziennik jest zapisem tego, co zjadłeś."
      : "Zniknie z listy produktów. W dzienniku nie ma ani jednej pozycji z tym produktem."}));
    root.appendChild(el("div",{class:"sheetrow"},[
      el("button",{class:"btn alt",text:"Zostaw",onclick:closeSheet}),
      el("button",{class:"btn danger",text:"Usuń",onclick:function(){
        var i=S.custom.indexOf(food);
        if(i<0)return closeSheet();
        S.custom.splice(i,1);forgetFood(food);saveNow();closeSheet();render();
        toast("Usunięto „"+food.n+"”","Cofnij",function(){
          S.custom.splice(Math.min(i,S.custom.length),0,food);forgetFood(food);saveNow();render();
        });
      }})
    ]));
  });
}

/* Po zmianie wartości pytamy, co z już zapisanymi pozycjami. Cicha przeróbka
   dziennika byłaby fałszowaniem historii, a cicha jej pominięcie zostawiałoby
   dziś zapisany posiłek z błędnymi liczbami — więc decyzja należy do
   użytkownika, z liczbą pozycji na wierzchu. */
function askRecalc(food,hits){
  openSheet(function(root){
    var before=hits.reduce(function(a,e){return a+e.k},0);
    var after=hits.reduce(function(a,e){return a+scale(food,e.g).k},0);
    root.appendChild(el("h3",{id:"sheetTitle",text:"Przeliczyć zapisane pozycje?"}));
    root.appendChild(el("div",{class:"per",text:
      "„"+food.n+"” jest w "+hits.length+" "+plural(hits.length,"zapisanej pozycji","zapisanych pozycjach","zapisanych pozycjach")+
      ". Nowe wartości dają dla nich "+fmt(after)+" kcal zamiast "+fmt(before)+
      ". Dziennik jest zapisem tego, co było — przelicz tylko wtedy, gdy poprzednie liczby były po prostu błędne."}));
    root.appendChild(el("div",{class:"sheetrow"},[
      el("button",{class:"btn alt",text:"Zostaw jak było",onclick:function(){closeSheet();toast("Poprawione: "+food.n)}}),
      el("button",{class:"btn",text:"Przelicz "+hits.length,onclick:function(){
        hits.forEach(function(e){
          var m=scale(food,e.g);
          e.n=food.n;e.k=m.k;e.p=m.p;e.c=m.c;e.f=m.f;e.u=food.u;e.s=food.s;
        });
        saveNow();closeSheet();render();
        toast("Przeliczone: "+hits.length+" "+plural(hits.length,"pozycja","pozycje","pozycji"));
      }})
    ]));
  });
}

function customSheet(opts){
  opts=opts||{};
  var base=opts.base, ed=opts.edit;
  openSheet(function(root){
    /* Etykiety odżywek, batonów i saszetek podają wartości NA PORCJĘ, nie na
       100 g. Wymuszanie przeliczania w głowie to najkrótsza droga do złych
       liczb w bazie, więc apka pyta, na co podane są wartości, i przelicza
       sama. W bazie i tak siedzi wszystko na 100 g. */
    var perPor=false;
    root.appendChild(el("h3",{id:"sheetTitle",text:ed?"Popraw produkt":"Własny produkt"}));
    var per=el("div",{class:"per"});
    root.appendChild(per);

    var f={},lab={};
    var src=ed||base;
    var pre={n:ed?ed.n:(opts.name||""),k:src?src.k:"",p:src?src.p:"",c:src?src.c:"",f:src?src.f:"",
             s:src?src.s:(opts.portion||100)};
    var mode=el("div",{class:"seg"});
    var out=el("div",{class:"note"});

    function unitTxt(){return perPor?"porcję":"100 g"}
    function paint(){
      [].forEach.call(mode.children,function(b,i){
        b.setAttribute("aria-pressed",(i===1)===perPor?"true":"false");
      });
      lab.k.textContent="kcal / "+unitTxt();
      lab.p.textContent="Białko (g) / "+unitTxt();
      lab.c.textContent="Węglowodany (g) / "+unitTxt();
      lab.f.textContent="Tłuszcz (g) / "+unitTxt();
      lab.s.textContent=perPor?"Ile waży porcja (g)":"Twoja porcja (g)";
      per.textContent=ed
        ? "Zmiana dotyczy przyszłych dodań. Już zapisane pozycje w dzienniku zostają takie, jakie były — chyba że poproszisz o przeliczenie."
        : base
        ? "Wartości przepisane z „"+base.n+"” — popraw te, które się różnią. Produkt zostanie w bazie na stałe."
        : (perPor
          ? "Przepisz liczby wprost z etykiety, dla jednej porcji — apka przeliczy je na 100 g sama."
          : "Podaj wartości z etykiety. Raz wpisane — potem dodajesz jednym tapnięciem.");
      recalc();
    }
    /* Na bieżąco pokazujemy, co wyląduje w bazie — inaczej przeliczanie jest
       magią, której nie da się sprawdzić. */
    function factor(){
      if(!perPor)return 1;
      var g=+f.s.value;
      return g>0?100/g:0;
    }
    function recalc(){
      var fa=factor();
      if(!perPor){out.textContent="";out.style.display="none";return}
      out.style.display="";
      if(!fa){out.textContent="Podaj jeszcze, ile gramów waży jedna porcja.";return}
      var k=Math.round((+f.k.value||0)*fa);
      var pp=Math.round((+f.p.value||0)*fa*10)/10;
      var cc=Math.round((+f.c.value||0)*fa*10)/10;
      var ff=Math.round((+f.f.value||0)*fa*10)/10;
      out.innerHTML="W bazie zapisze się: <b class='num'>"+fmt(k)+"</b> kcal · B <b class='num'>"+
        String(pp).replace(".",",")+"</b> · W <b class='num'>"+String(cc).replace(".",",")+
        "</b> · T <b class='num'>"+String(ff).replace(".",",")+"</b> na 100 g, a porcja to <b class='num'>"+
        fmt(+f.s.value||0)+" g</b>.";
    }
    [["100 g",false],["porcję",true]].forEach(function(o){
      mode.appendChild(el("button",{text:o[0],onclick:function(){
        if(o[1]&&!perPor&&(+f.s.value===100||!f.s.value))f.s.value="";
        if(!o[1]&&perPor&&!f.s.value)f.s.value=100;
        perPor=o[1];paint();
        if(o[1])f.s.focus();
      }}));
    });

    [["n","Nazwa","text"],["k","kcal","number"],["p","Białko (g)","number"],
     ["c","Węglowodany (g)","number"],["f","Tłuszcz (g)","number"],["s","Porcja (g)","number"]].forEach(function(x){
      var i=el("input",{type:x[2],inputmode:x[2]==="number"?"decimal":null,value:pre[x[0]],
        oninput:x[0]==="n"?null:recalc});
      var l=el("label",{text:x[1]});
      f[x[0]]=i;lab[x[0]]=l;
      root.appendChild(el("div",{class:"field"},[l,i]));
      if(x[0]==="n")root.appendChild(el("div",{class:"field"},[el("label",{text:"Wartości podane na"}),mode]));
    });
    root.appendChild(out);
    paint();

    var row=el("div",{class:"sheetrow"});
    if(ed){
      row.appendChild(el("button",{class:"btn danger",text:"Usuń produkt",onclick:function(){
        closeSheet();deleteCustom(ed);
      }}));
    }else{
      row.appendChild(el("button",{class:"btn alt",text:"Anuluj",onclick:closeSheet}));
    }
    row.appendChild(el("button",{class:"btn",text:ed?"Zapisz zmiany":"Zapisz",onclick:function(){
      var name=f.n.value.trim();
      if(!name)return f.n.focus();
      var por=Math.max(1,+f.s.value||100);
      if(perPor&&!(+f.s.value>0)){
        out.textContent="Podaj jeszcze, ile gramów waży jedna porcja.";
        return f.s.focus();
      }
      var fa=perPor?100/por:1;
      var vals={n:name,
        k:Math.round((+f.k.value||0)*fa*10)/10,
        p:Math.round((+f.p.value||0)*fa*100)/100,
        c:Math.round((+f.c.value||0)*fa*100)/100,
        f:Math.round((+f.f.value||0)*fa*100)/100,
        s:por};
      if(ed){
        var moved=["k","p","c","f"].some(function(x){return ed[x]!==vals[x]});
        ["n","k","p","c","f","s"].forEach(function(x){ed[x]=vals[x]});
        forgetFood(ed);
        saveNow();closeSheet();render();
        var hits=entriesOf(ed.id);
        if(moved&&hits.length)askRecalc(ed,hits);
        else toast("Poprawione: "+ed.n);
        return;
      }
      var food={id:"own-"+slug(name)+"-"+Date.now().toString(36),n:name,cat:"own",
        k:vals.k,p:vals.p,c:vals.c,f:vals.f,
        s:por,u:base?base.u:"g",pc:base?base.pc:0,own:true};
      S.custom.push(food);saveNow();closeSheet();
      if(opts.onFood)opts.onFood(food);
      else{addEntry(food,food.s);render()}
    }}));
    root.appendChild(row);
  });
}

/* ═══════════════════════ 8. widok: Zestawy ═══════════════════════ */
/* Zestaw dawało się tylko dodać albo usunąć w całości. Zmiana gramatury,
   wyrzucenie jednego składnika albo poprawienie nazwy wymagały zbudowania
   posiłku od nowa w dzienniku i zapisania go jeszcze raz — czyli tej samej
   pracy, którą zestaw miał oszczędzić. */
function reGram(it,g){
  var f=byId(it.fid);
  if(f){var m=scale(f,g);return {k:m.k,p:m.p,c:m.c,f:m.f}}
  /* Produkt mógł zostać usunięty z bazy. Zestaw trzyma własne wartości, więc
     skalujemy proporcjonalnie — lepsze to niż zablokowana edycja. */
  var r=it.g>0?g/it.g:1;
  return {k:it.k*r,p:it.p*r,c:it.c*r,f:it.f*r};
}
function setSheet(st){
  openSheet(function(root){
    /* Pracujemy na kopii: „Anuluj” musi naprawdę nic nie zmieniać. */
    var items=st.items.map(function(i){var c={};for(var k in i)c[k]=i[k];return c});
    var name=st.n;
    root.appendChild(el("h3",{id:"sheetTitle",text:"Zestaw"}));
    var sum=el("div",{class:"per"});
    root.appendChild(sum);

    var nameInp=el("input",{type:"text",value:name,oninput:function(){name=this.value}});
    root.appendChild(el("div",{class:"field"},[el("label",{text:"Nazwa"}),nameInp]));

    var list=el("div");
    root.appendChild(el("div",{class:"field"},[el("label",{text:"Składniki"}),list]));

    function total(){
      var k=items.reduce(function(a,i){return a+i.k},0);
      var pp=items.reduce(function(a,i){return a+i.p},0);
      var cc=items.reduce(function(a,i){return a+i.c},0);
      var ff=items.reduce(function(a,i){return a+i.f},0);
      sum.innerHTML=items.length
        ? "<b class='num'>"+fmt(k)+"</b> kcal · B <b class='num'>"+fmt(pp)+
          "</b> · W <b class='num'>"+fmt(cc)+"</b> · T <b class='num'>"+fmt(ff)+"</b>"
        : "Zestaw bez składników nie ma czego dodawać — dorzuć coś albo usuń go.";
    }
    function paint(){
      list.innerHTML="";
      items.forEach(function(it,idx){
        var f=byId(it.fid);
        var kcalEl=el("s",{text:fmt(it.k)+" kcal"});
        function apply(g){
          var m=reGram(it,g);
          it.g=g;it.k=m.k;it.p=m.p;it.c=m.c;it.f=m.f;
          kcalEl.textContent=fmt(it.k)+" kcal";
          total();
        }
        var val=numBox({cls:"v",value:it.g,unit:f&&f.u==="ml"?"ml":"g",min:1,max:5000,
          label:"Gramatura "+it.n,onChange:apply});
        function nudge(d){var g=Math.max(1,it.g+d);val.set(g);apply(g)}
        list.appendChild(el("div",{class:"nlrow"},[
          el("span",{class:"n"},[
            el("b",{text:it.n}),
            kcalEl
          ]),
          el("button",{class:"rm","aria-label":"Usuń "+it.n,onclick:function(){
            items.splice(idx,1);paint();total();
          }},[svg(ICON.x)]),
          el("div",{class:"g"},[
            el("button",{text:"−","aria-label":"Mniej",onclick:function(){nudge(it.g>60?-10:-5)}}),
            val.el,
            el("button",{text:"+","aria-label":"Więcej",onclick:function(){nudge(it.g>=60?10:5)}})
          ])
        ]));
      });
      if(!items.length)list.appendChild(el("div",{class:"note",text:"Nic tu nie zostało."}));
    }
    paint();total();

    /* Dokładanie składnika bez wychodzenia z arkusza — inaczej „edycja”
       znaczyłaby tylko „ujmowanie”. */
    var found=el("div");
    var q=el("input",{type:"search",placeholder:"Dorzuć produkt — np. banan",autocomplete:"off",
      oninput:function(){
        var v=norm(this.value).split(/\s+/).filter(Boolean);
        found.innerHTML="";
        if(!v.length)return;
        allFoods().filter(function(f){return searchHit(f,v)}).slice(0,6).forEach(function(f){
          found.appendChild(el("button",{class:"chip ghost",onclick:function(){
            var m=scale(f,f.s);
            items.push({fid:f.id,n:f.n,g:f.s,u:f.u,s:f.s,k:m.k,p:m.p,c:m.c,f:m.f});
            q.value="";found.innerHTML="";paint();total();
          }},[el("span",{class:"n",text:f.n+" · "+addLabel(f)})]));
        });
      }});

      el("div",{class:"sheetrow",style:"padding-top:0"},[
        el("button",{class:"btn",text:"Dodaj do "+dayTitle(day).toLowerCase(),onclick:function(){
          if(!S.log[day])S.log[day]=[];
          var added=[];
          st.items.forEach(function(i){
            var copy={};for(var k in i)copy[k]=i[k];
            copy.t=Date.now()+added.length;
            S.log[day].push(copy);added.push(copy);
            bump(i.fid);
          });
          save();go("today");
          toast("Dodano „"+st.n+"”","Cofnij",function(){
            S.log[day]=S.log[day].filter(function(e){return added.indexOf(e)<0});save();render();

        }},[svg(ICON.trash)])

  });

    wrap.appendChild(el("button",{class:"btn alt",text:"↺ Skopiuj cały wczorajszy dzień",onclick:function(){copyDay(y);go("today")}}));

var SPLITS={bal:{n:"Zbalansowany",p:.30,c:.40,f:.30},hp:{n:"Więcej białka",p:.40,c:.35,f:.25},lc:{n:"Mniej węgli",p:.30,c:.20,f:.50}};
function viewMe(){
  var wrap=document.createDocumentFragment();
  wrap.appendChild(el("h2",{text:"Ja i cele"}));

  var P=S.profile||{sex:"m",age:30,w:75,h:178,act:1.55,aim:0};
  function stepper(label,key,step,unit,min,max){
    var box=numBox({value:P[key],unit:unit,min:min,max:max,dec:step<1,label:label,
      onChange:function(v){P[key]=v;refresh()}});
    function nudge(d){
      P[key]=Math.min(max,Math.max(min,Math.round((P[key]+d)*10)/10));
      box.set(P[key]);refresh();
    }
    return el("div",{class:"field"},[el("label",{text:label}),el("div",{class:"stepper"},[
      el("button",{text:"−","aria-label":"Mniej "+label,onclick:function(){nudge(-step)}}),
      box.el,
      el("button",{text:"+","aria-label":"Więcej "+label,onclick:function(){nudge(step)}})
    ])]);
  }
  function segs(label,opts,key,after){
    var box=el("div",{class:"seg"});
    opts.forEach(function(o){
      box.appendChild(el("button",{text:o[1],"aria-pressed":P[key]===o[0]?"true":"false",onclick:function(){
        P[key]=o[0];
        [].forEach.call(box.children,function(b,i){b.setAttribute("aria-pressed",opts[i][0]===P[key]?"true":"false")});
        if(after)after();
      }}));
    });
    return el("div",{class:"field"},[el("label",{text:label}),box]);
  }
  var out=el("div",{class:"note"});
  function calc(){
    var bmr=10*P.w+6.25*P.h-5*P.age+(P.sex==="m"?5:-161);
    var tdee=bmr*P.act;
    var k=Math.round((tdee*(1+P.aim))/10)*10;
    return k;
  }
  function refresh(){
    var k=calc();
    out.innerHTML="Wyliczone zapotrzebowanie: <b class='num'>"+fmt(k)+" kcal</b> / dzień (Mifflin-St Jeor).";
  }
  refresh();

  wrap.appendChild(el("div",{class:"card"},[
    el("div",{class:"eyebrow",text:"Kalkulator celu"}),
    segs("Płeć",[["m","Mężczyzna"],["k","Kobieta"]],"sex",refresh),
    stepper("Wiek","age",1,"lat",14,99),
    stepper("Waga","w",0.5,"kg",35,250),
    stepper("Wzrost","h",1,"cm",120,220),
    segs("Aktywność",[[1.2,"Siedząca"],[1.375,"Lekka"],[1.55,"Średnia"],[1.725,"Duża"],[1.9,"Bardzo duża"]],"act",refresh),
    segs("Cel",[[-0.2,"Schudnąć"],[0,"Utrzymać"],[0.12,"Przytyć"]],"aim",refresh),
    out,
    el("button",{class:"btn",text:"Ustaw jako mój cel",onclick:function(){
      S.profile=P;
      S.goal.k=calc();
      applySplit();
      save();render();toast("Cel ustawiony: "+fmt(S.goal.k)+" kcal");
    }})
  ]));

  /* Wzór opisuje statystycznego człowieka o Twoich wymiarach, a mnożnik
     aktywności i tak zgadujesz. To samo można zmierzyć: przy znanym spożyciu
     tempo zmiany wagi mówi, ile realnie spalasz. */
  var R=tdeeReal();
  var kal=[el("div",{class:"eyebrow",text:"Cel z Twoich danych"})];
  if(R.ok){
    var kw=kgWeek(R.fit.slope);
    var aimK=Math.round((R.tdee*(1+((S.profile&&S.profile.aim)||0)))/10)*10;
    kal.push(el("div",{class:"preview"},[
      el("span",{class:"v num",text:fmt(R.tdee)}),
      el("span",{class:"u",text:"kcal · tyle realnie spalasz"})
    ]));
    kal.push(el("div",{class:"note",html:
      "Z <b class='num'>"+R.logged+"</b> "+plural(R.logged,"dnia","dni","dni")+
      " zapisanego jedzenia (średnio <b class='num'>"+fmt(R.mean)+"</b> kcal) i tempa "+
      "<b class='num'>"+(kw>0?"+":kw<0?"−":"±")+Math.abs(kw).toFixed(2).replace(".",",")+
      "</b> kg na tydzień, na przestrzeni <b class='num'>"+R.span+"</b> dni."+
      (R.miss?" Dni bez zapisu ("+R.miss+") są pominięte — jeśli w nich jadłeś, wynik jest zaniżony.":"")}));
    kal.push(el("div",{class:"note",html:
      "Wzór daje <b class='num'>"+fmt(calc())+"</b> kcal przy Twoim celu, pomiar — "+
      "<b class='num'>"+fmt(aimK)+"</b> kcal. Różnica to Twój metabolizm i aktywność, "+
      "których wzór nie zna."}));
    kal.push(el("button",{class:"btn",text:"Ustaw cel z pomiaru: "+fmt(aimK)+" kcal",onclick:function(){
      S.goal.k=aimK;applySplit();saveNow();render();
      toast("Cel z pomiaru: "+fmt(aimK)+" kcal");
    }}));
  }else{
    var need={wagi:"jeszcze "+R.need+" "+plural(R.need,"pomiar wagi","pomiary wagi","pomiarów wagi"),
              czas:"jeszcze "+R.need+" "+plural(R.need,"dzień","dni","dni")+" odstępu między pierwszym a ostatnim pomiarem",
              dni:"jeszcze "+R.need+" "+plural(R.need,"dzień","dni","dni")+" z zapisanym jedzeniem"}[R.why];
    kal.push(el("div",{class:"note",html:
      "Zamiast wierzyć wzorowi, można to zmierzyć: przy znanym spożyciu tempo zmiany "+
      "wagi mówi, ile realnie spalasz. Potrzebuję do tego <b>"+need+"</b>."+
      (R.why==="dni"?" Liczą się dni, w których zapisałeś cały dzień — średnia z połowy dni to nie średnie spożycie.":"")}));
    kal.push(el("button",{class:"btn alt",text:"Wpisz wagę",onclick:function(){go("today");setTimeout(weightSheet,220)}}));
  }
  wrap.appendChild(el("div",{class:"card"},kal));

  var splitBox=el("div",{class:"seg"});
  Object.keys(SPLITS).forEach(function(k){
    var s=SPLITS[k];
    splitBox.appendChild(el("button",{text:s.n+" "+Math.round(s.p*100)+"/"+Math.round(s.c*100)+"/"+Math.round(s.f*100),
      "aria-pressed":S.split===k?"true":"false",onclick:function(){S.split=k;applySplit();save();render()}}));
  });
  wrap.appendChild(el("div",{class:"card"},[
    el("div",{class:"eyebrow",text:"Rozkład makro (B / W / T)"}),
    splitBox,
    el("div",{class:"note",html:"Teraz: <b class='num'>"+fmt(S.goal.k)+"</b> kcal · B <b class='num'>"+fmt(S.goal.p)+" g</b> · W <b class='num'>"+fmt(S.goal.c)+" g</b> · T <b class='num'>"+fmt(S.goal.f)+" g</b>"}),
    el("button",{class:"btn alt",text:"Ustaw ręcznie",onclick:manualSheet})
  ]));

  var themeBox=el("div",{class:"seg"});
  [["auto","Auto"],["light","Jasny"],["dark","Ciemny"]].forEach(function(o){
    themeBox.appendChild(el("button",{text:o[1],"aria-pressed":S.theme===o[0]?"true":"false",
      onclick:function(){S.theme=o[0];applyTheme();save();render()}}));
  });
  wrap.appendChild(el("div",{class:"card"},[
    el("div",{class:"eyebrow",text:"Motyw"}),themeBox
  ]));

  wrap.appendChild(el("div",{class:"card"},[
    el("div",{class:"eyebrow",text:"Twoje dane"}),
    el("div",{class:"note",text:"Wszystko siedzi tylko w tej przeglądarce (localStorage) — nic nie wychodzi na żaden serwer. Kopia zapasowa to zwykły tekst: skopiuj go sobie gdziekolwiek."}),
    el("button",{class:"btn alt",text:"Kopia zapasowa / przywracanie",onclick:backupSheet}),

      openSheet(function(root){

            closeSheet();day=dkey(new Date());render();toast("Wyczyszczone");

  ]));
  return wrap;

  else if(/przekask|podwieczorek|deser/.test(flat))res.slot="Przekąska";
  if(/przedwczoraj/.test(flat))res.dayShift=-2;
  else if(/wczoraj/.test(flat))res.dayShift=-1;

  var pend=null,age=0,seenSkip={};
  for(a=0;a<toks.length;a++){
    t=toks[a];
    if(t.used)continue;
    if(t.brk){pend=null;continue}
    if(t.num!=null||t.unit){
      if(!pend)pend={num:null,unit:null,toks:[]};
      if(t.num!=null&&pend.num==null)pend.num=t.num;
      if(t.unit)pend.unit=t.unit;
      pend.toks.push(t);age=0;
      continue;
    }
    if(!t.n){continue}
    /* "jogurt bez cukru" nie może dodać cukru jako składnika */
    if(toks[a-1]&&toks[a-1].n==="bez"){t.qual=1;t.neg=1;if(pend){age++;if(age>3)pend=null}continue}
    /* "sos" czy "deser" same są słowami funkcyjnymi, ale zaczynają nazwy
       produktów. Dopuszczamy je tylko jako początek dłuższej frazy — inaczej
       "sos sojowy" gubił się i doliczał napój sojowy, a "sos czosnkowy" czosnek. */
    var m=matchAt(toks,a);
    if(m&&STOP[t.n]&&m.len<2)m=null;
    if(m&&m.len===1&&NOTFOOD[t.n])m=null;
    /* Przymiotnik nie może sam z siebie stać się produktem: "ser wędzony"
       dopisywał łososia, "marchewka surowa" surówkę, "kotlet wege" węgorza.
       Liczy się tylko wtedy, gdy trafia w nazwę dokładnie ("bezalkoholowe")
       albo jest częścią dłuższej frazy ("kurczak panierowany"). */
    if(m&&m.len===1&&QUAL[t.n]&&!(m.k===1&&m.w0===t.n))m=null;
    if(m){
      var pv=pctPick(m.f,toks,a+m.len);
      if(pv)m={f:pv,len:m.len,score:m.score,k:m.k,w0:m.w0};
      var q=pend;
      if(!q){
        /* ilość podana po produkcie: "ryż 200 g" — ale tylko z liczbą,
           żeby "jajka, garść migdałów" nie przypisało garści do jajek */
        var j=a+m.len,fw={num:null,unit:null,toks:[]},got=false,lim=a+m.len+2;
        while(j<toks.length&&j<lim){
          var u=toks[j];
          /* Token z procentem został już zużyty na wybór wariantu ("0%"),
             ale nie może zjadać miejsca w okienku, w którym szukamy gramów. */
          if(u.used&&String(u.raw).slice(-1)==="%"){j++;lim++;continue}
          if(u.brk||u.used)break;
          if(u.num!=null&&!u.frac&&fw.num==null){fw.num=u.num;fw.toks.push(u);got=true;j++;continue}
          if(u.unit&&got){fw.unit=u.unit;fw.toks.push(u);j++;continue}
          break;
        }
        if(got)q=fw;
      }
      var g=qtyGrams(m.f,q);
      if(q)q.toks.forEach(function(x){x.used=true});
      for(var z=0;z<m.len;z++)toks[a+z].used=true;
      res.items.push({f:m.f,g:g,at:a,len:m.len,qty:!!q});
      pend=null;age=0;a+=m.len-1;
      continue;
    }
    /* Liczba nie przechodzi przez spójnik, czasownik ani porę dnia. Wyjątek:
       gdy zaraz po nich stoi kolejna liczba („dwa i pół banana”) — to jest
       jedna wartość, nie dwie. */
    if(pend&&BREAK[t.n]){
      var nx=toks[a+1];
      if(!(nx&&nx.num!=null))pend=null;
    }
    if(QUAL[t.n]){t.qual=1;if(pend){age++;if(age>3)pend=null}continue}
    if(!STOP[t.n]&&t.n.length>=4&&!seenSkip[t.n]&&res.skipped.length<6){
      seenSkip[t.n]=1;res.skipped.push(t.raw);
    }
    if(pend){age++;if(age>3)pend=null}
  }
  /* "X z Y" znaczy dwie różne rzeczy i trzeba je rozróżnić, bo inaczej
     kalorie liczą się podwójnie:
       "burger z wołowiną"      — wołowina JEST w burgerze, opis dania
       "zapiekanka z 4 jaj…"    — lista składników, danie to tylko nazwa
       "chleb z masłem"         — dwa osobne składniki, oba się liczą
     Rozstrzyga to, czy pierwszy produkt jest daniem złożonym, ile rzeczy
     wymieniono po "z" i czy podano dla nich ilości. */
  if(res.items.length>=2){
    var head=res.items[0];
    var nx=toks[head.at+head.len];
    if(nx&&nx.n&&(nx.n==="z"||nx.n==="ze")){
      var rest=res.items.slice(1);
      var qtys=0;
      rest.forEach(function(x){if(x.qty)qtys++});
      var composite=isDish(head.f);
      var descriptive=composite&&(head.qty||rest.length===1||(rest.length===2&&qtys===0));
      var recipe=composite&&!descriptive&&!head.qty&&rest.length>=2;
      if(descriptive){
        /* nie gubimy tego po cichu — podgląd pokaże, co pominięto i dlaczego */
        res.inside=rest.map(function(x){return x.f.n});
        res.items=[head];
      }else if(recipe){
        res.dish=head.f.n;res.items=rest;
      }
    }
  }
  /* kwalifikator przylegający do produktu, którego nie ma w jego nazwie:
     "piwo light" przy braku wersji light = liczby są nie te */
  /* szukamy do 3 tokenów w obie strony, przeskakując spójniki ("bez cukru"),
     ale nie przechodząc przez przecinek ani przez inny produkt */
  function nearQual(from,dir){
    for(var i=1;i<=3;i++){
      var c=toks[from+dir*i];
      if(!c||c.brk)return null;
      if(c.qual&&!c.used)return c;
      if(c.n==="bez"||c.n==="w"||c.n==="z"||c.n==="ze"||c.n==="na")continue;
      return null;
    }
    return null;
  }
  res.items.forEach(function(it){
    var nn=norm(it.f.n);
    [nearQual(it.at,-1),nearQual(it.at+it.len-1,1)].forEach(function(c){
      if(!c||!c.qual||c.used||it.warn)return;
      var stem=c.n.slice(0,Math.min(6,c.n.length));
      if(nn.indexOf(stem)>-1)return;
      it.warn=c.neg?"bez "+c.raw:c.raw;
      c.used=true;
    });
  });
  toks.forEach(function(t){
    if(t.qual&&!t.used&&t.n.length>=4&&res.skipped.length<6&&res.skipped.indexOf(t.raw)<0)res.skipped.push(t.raw);
  });

  /* ten sam produkt raz bez ilości, raz z ilością ("owsianka: 60 g płatków
     owsianych") to jedna rzecz nazwana dwa razy — zostaje wersja z ilością */
  var withQty={};
  res.items.forEach(function(it){if(it.qty)withQty[it.f.id]=1});
  res.items=res.items.filter(function(it){return it.qty||!withQty[it.f.id]});

  /* niezużyty ułamek na końcu = "zjadłem tego połowę" */
  for(a=toks.length-1;a>=0;a--){
    if(toks[a].frac&&!toks[a].used&&toks[a].num!=null){res.divisor=toks[a].num;break}
  }
  return res;
}

/* ═══════════════════════ 12a. dyktowanie ═══════════════════════
   Jedyny fragment apki, który może wyjść z urządzenia: Web Speech API
   w Chrome i Edge wysyła nagranie do usługi producenta przeglądarki.
   Mówimy o tym w arkuszu, a nie w dokumentacji, której nikt nie czyta.
   Sam parser i zapis zostają lokalne. */
var DICT=null;
function speechCtor(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
var SPEECH_ERR={
  "not-allowed":"Brak zgody na mikrofon — zezwól na dostęp dla tej strony.",
  "service-not-allowed":"Przeglądarka nie pozwala tu na rozpoznawanie mowy.",
  "audio-capture":"Nie widzę mikrofonu.",
  "network":"Rozpoznawanie mowy potrzebuje sieci, a jej nie ma.",
  "no-speech":"Nic nie usłyszałem.",
  "aborted":""
};
var SPEECH_FATAL={"not-allowed":1,"service-not-allowed":1,"audio-capture":1,"network":1};
function startDictation(cb){
  var C=speechCtor();
  if(!C)return null;
  var r=new C();
  r.lang="pl-PL";r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  var done="",stopped=false,fatal=false,restarts=0,ended=false;
  r.onresult=function(e){
    var interim="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t=e.results[i][0].transcript;
      if(e.results[i].isFinal)done+=t+" ";else interim+=t;
    }
    cb.onText(done,interim);
  };
  r.onerror=function(e){
    if(SPEECH_FATAL[e.error])fatal=true;
    var m=SPEECH_ERR[e.error];
    cb.onError(m==null?"Rozpoznawanie mowy nie zadziałało.":m);
  };
  r.onend=function(){
    /* Safari na iOS kończy sesję po każdej frazie — wracamy do słuchania,
       dopóki użytkownik nie tapnie stop. Limit chroni przed pętlą. */
    if(!stopped&&!fatal&&restarts<60){restarts++;try{r.start();return}catch(err){}}
    /* Zamknięć sesji może przyjść więcej niż jedno (restart nasłuchu na iOS
       plus nasze stop) — koniec zgłaszamy dokładnie raz, bo inaczej podgląd
       otwiera się drugi raz, już po zatwierdzeniu posiłku. */
    if(ended)return;
    ended=true;
    cb.onEnd(done.trim());
  };
  try{r.start()}catch(err){return null}
  return {stop:function(){stopped=true;try{r.stop()}catch(e){}}};
}

/* ═══════════════════════ 12. arkusz: opis posiłku ═══════════════════════ */
var NLPH="np. na śniadanie zapiekanka z 4 jaj, 2 serków wiejskich, garści pomidorków koktajlowych i 8 oliwek, na górze feta — zjadłem połowę";
var PARTS=[["¼",0.25],["⅓",1/3],["½",0.5],["⅔",2/3],["¾",0.75],["całość",1]];

function nlSheet(prefill,autoDictate){
  var text=prefill||"";
  /* Przepływ przestaje żyć po zatwierdzeniu. Spóźnione wywołanie z
     rozpoznawania mowy nie ma go prawa wskrzesić. */
  var live=true;
  ask();

  function ask(){
    openSheet(function(root){
      root.appendChild(el("h3",{id:"sheetTitle",text:"Opisz posiłek"}));
      root.appendChild(el("div",{class:"per",text:"Powiedz albo napisz zwykłym zdaniem — z czego się składał i ile z tego zjadłeś."}));

      var ta=el("textarea",{spellcheck:"false",placeholder:NLPH,style:"min-height:112px"});
      ta.value=text;

      var ic=el("span",{class:"ic"}),lb=el("span",{class:"lb"});
      var mic=el("button",{class:"dictate",onclick:function(){toggle()}},[ic,lb]);
      var supported=!!speechCtor();
      function paint(on,note){
        ic.innerHTML="";ic.appendChild(svg(on?ICON.stop:ICON.mic));
        lb.innerHTML="";
        lb.appendChild(el("span",{text:on?"Słucham — tapnij, gdy skończysz":"Dyktuj"}));
        if(note)lb.appendChild(el("s",{text:note}));
        mic.className="dictate"+(on?" on":"");
      }
      var lastErr=null;
      function toggle(){
        if(DICT){DICT.stop();return}
        lastErr=null;
        var h=startDictation({
          onText:function(fin,interim){ta.value=(fin+interim).replace(/\s+/g," ").trim();text=ta.value},
          onError:function(msg){if(msg){lastErr=msg;paint(!!DICT,msg)}},
          onEnd:function(fin){
            DICT=null;
            text=ta.value.trim();
            /* Po zakończeniu dyktowania od razu podgląd — o to chodzi, żeby
               nie tapać więcej niż trzeba. Poprawić można w podglądzie. */
            if(text)review(parseMeal(text));
            /* Konkretny powód ("brak zgody na mikrofon") jest użyteczniejszy
               niż ogólne "nic nie usłyszałem" — nie nadpisujemy go. */
            else paint(false,lastErr||"Nic nie zapisałem — spróbuj jeszcze raz.");
          }
        });
        if(!h){paint(false,"Nie udało się uruchomić mikrofonu.");return}
        DICT=h;paint(true);
      }
      if(supported){
        paint(false);
        root.appendChild(mic);
        var note="Dyktowanie korzysta z rozpoznawania mowy przeglądarki — w Chrome i Edge nagranie idzie na serwery jej producenta. To jedyna część apki, która wychodzi z urządzenia; liczenie i zapis zostają u Ciebie.";
        /* Strona osadzona w innej (podgląd) zwykle nie ma prawa do mikrofonu —
           bez tego zdania odmowa wygląda na winę użytkownika. */
        try{if(window.self!==window.top)note+=" Tu strona jest osadzona w innej, więc mikrofon może być zablokowany — wtedy zadziała pod własnym adresem.";}catch(e){
          note+=" Tu strona jest osadzona w innej, więc mikrofon może być zablokowany — wtedy zadziała pod własnym adresem.";
        }
        root.appendChild(el("div",{class:"dictnote",text:note}));
      }else{
        paint(false,"Ta przeglądarka nie ma rozpoznawania mowy — wpisz opis poniżej.");
        mic.setAttribute("disabled","");
        root.appendChild(mic);
      }

      root.appendChild(el("div",{class:"field"},[el("label",{text:"Opis"}),ta]));
      root.appendChild(el("div",{class:"sheetrow"},[
        el("button",{class:"btn alt",text:"Anuluj",onclick:closeSheet}),
        el("button",{class:"btn",text:"Rozpoznaj",onclick:function(){text=ta.value;review(parseMeal(text))}})
      ]));
      if(autoDictate&&supported)toggle();
      else setTimeout(function(){ta.focus()},280);
    });
  }

  function review(r){
    if(!live||!sheetEl.classList.contains("on"))return;
    var items=r.items.map(function(x){return {f:x.f,g:x.g,warn:x.warn}});
    var part=r.divisor==null?1:r.divisor;
    var sl=r.slot||slot(Date.now());
    var dk=shiftKey(day,r.dayShift);
    var asSet=!!r.dish&&items.length>1;
    var setName=r.dish||sl;
    draw();

    function total(mult){
      var t={k:0,p:0,c:0,f:0};
      items.forEach(function(it){
        var m=scale(it.f,it.g*mult);
        t.k+=m.k;t.p+=m.p;t.c+=m.c;t.f+=m.f;
      });
      return t;
    }
    function draw(){
      openSheet(function(root){
        if(!items.length){
          root.appendChild(el("h3",{id:"sheetTitle",text:"Nie rozpoznałem produktów"}));
          root.appendChild(el("div",{class:"per",text:"Nic z tego opisu nie pasuje do bazy. Spróbuj nazwać składniki prościej („4 jajka”, „150 g ryżu”) albo dodaj brakujący produkt raz na zawsze."}));
          if(r.skipped.length)root.appendChild(el("div",{class:"note",text:"Pominięte słowa: "+r.skipped.join(", ")}));
          root.appendChild(el("div",{class:"sheetrow"},[
            el("button",{class:"btn alt",text:"Popraw opis",onclick:ask}),
            el("button",{class:"btn",text:"Własny produkt",onclick:function(){customSheet({name:text})}})
          ]));
          return;
        }
        root.appendChild(el("h3",{id:"sheetTitle",text:"Rozpoznałem"}));
        root.appendChild(el("div",{class:"per",text:"Trafi do: "+dayTitle(dk).toLowerCase()+(r.dish?" · danie: "+r.dish:"")+". Popraw, co się nie zgadza."}));

        var slBox=el("div",{class:"seg"});
        SLOTS.forEach(function(o){
          slBox.appendChild(el("button",{text:o,"aria-pressed":sl===o?"true":"false",
            onclick:function(){sl=o;draw()}}));
        });
        root.appendChild(el("div",{class:"field"},[el("label",{text:"Posiłek"}),slBox]));

        var live=[];   /* elementy do odświeżenia bez przebudowy arkusza */
        function repaint(){
          live.forEach(function(f){f()});
        }
        items.forEach(function(it,ix){
          /* produkty na sztuki/garście chodzą po pół porcji, żeby nie
             wychodziło "3,8 szt" — w gramach normalnie po 10 g */
          var piecey=it.f.u!=="g"&&it.f.u!=="ml";
          var bump=function(dir){
            if(piecey){
              var q=Math.round(it.g/it.f.s*2)/2;
              it.g=Math.round(Math.max(0.5,q+dir*0.5)*it.f.s);
            }else it.g=Math.max(1,it.g+dir*(it.g>=60?10:5));
            gBox.set(it.g);rowPaint();repaint();
          };
          var m=scale(it.f,it.g);
          var unitEl=el("s",{text:unitLabel(it.f,it.g)});
          var kcEl=el("div",{class:"kc num",text:fmt(m.k)+" kcal"});
          function rowPaint(){
            var mm=scale(it.f,it.g);
            unitEl.textContent=unitLabel(it.f,it.g);
            kcEl.textContent=fmt(mm.k)+" kcal";
          }
          var gBox=numBox({cls:"v",value:it.g,unit:it.f.u==="ml"?"ml":"g",min:1,max:5000,
            label:"Gramatura "+it.f.n,onChange:function(v){it.g=v;rowPaint();repaint()}});
          var kids=[
            el("div",{class:"n"},[el("b",{text:it.f.n}),unitEl]),
            kcEl,
            el("button",{class:"rm","aria-label":"Usuń "+it.f.n,onclick:function(){items.splice(ix,1);draw()}},[svg(ICON.x)]),
            el("div",{class:"g"},[
              el("button",{text:"−","aria-label":"Mniej "+it.f.n,onclick:function(){bump(-1)}}),
              gBox.el,
              el("button",{text:"+","aria-label":"Więcej "+it.f.n,onclick:function(){bump(1)}})
            ])
          ];
          if(it.warn)kids.push(el("div",{class:"warn"},[
            svg(ICON.alert),
            el("span",{},[
              el("span",{text:"nie mam wersji „"+it.warn+"” — liczby są dla zwykłej. "}),
              el("button",{text:"popraw wartości",onclick:function(){
                customSheet({name:it.f.n+" "+it.warn,base:it.f,onFood:function(food){
                  it.f=food;it.warn=null;draw();
                }});
              }})
            ])
          ]));
          root.appendChild(el("div",{class:"nlrow"},kids));
        });

        var pBox=el("div",{class:"seg"});
        PARTS.forEach(function(o){
          pBox.appendChild(el("button",{text:o[0],"aria-pressed":Math.abs(part-o[1])<0.02?"true":"false",
            onclick:function(){part=o[1];draw()}}));
        });
        root.appendChild(el("div",{class:"field",style:"margin-top:14px"},[
          el("label",{text:"Ile z tego zjadłeś"}),pBox]));

        var totK=el("span",{class:"v num"}),totU=el("span",{class:"u"});
        var totM=el("div",{class:"pvmac"});
        function paintTot(){
          var t=total(part);
          totK.textContent=fmt(t.k);
          totU.textContent=part<1?"kcal — z całości "+fmt(total(1).k):"kcal";
          totM.innerHTML=
            "<span style='color:var(--p);font-weight:700'>B</span> <i class='num'>"+fmt(t.p)+" g</i>"+
            "<span style='color:var(--c);font-weight:700'>W</span> <i class='num'>"+fmt(t.c)+" g</i>"+
            "<span style='color:var(--f);font-weight:700'>T</span> <i class='num'>"+fmt(t.f)+" g</i>";
        }
        live.push(paintTot);
        paintTot();
        root.appendChild(el("div",{class:"nltot"},[totK,totU]));
        root.appendChild(totM);

        /* Decyzja "to jest w środku dania" musi być widoczna, bo inaczej
           wygląda jak zgubiony składnik. */
        if(r.inside&&r.inside.length)root.appendChild(el("div",{class:"note",
          text:"Nie doliczyłem osobno: "+r.inside.join(", ")+" — to jest już w „"+items[0].f.n+"”. Jeśli dodawałeś to sam, wpisz z ilością, np. „100 g wołowiny”."}));
        if(r.skipped.length)root.appendChild(el("div",{class:"note",text:"Pominięte słowa: "+r.skipped.join(", ")+". Jeśli któreś z nich to jedzenie, dopisz je prościej albo dodaj jako własny produkt."}));

        if(items.length>1){
          var nameF=el("input",{type:"text",value:setName,oninput:function(){setName=this.value}});
          var tg=el("button",{class:"toggle","aria-pressed":asSet?"true":"false",onclick:function(){asSet=!asSet;draw()}},[
            el("span",{class:"box"},[svg(ICON.check)]),
            el("span",{class:"lb",text:"Zapisz też jako zestaw — następny raz jedno tapnięcie"})
          ]);
          root.appendChild(tg);
          if(asSet)root.appendChild(el("div",{class:"field"},[el("label",{text:"Nazwa zestawu"}),nameF]));
        }

        root.appendChild(el("div",{class:"sheetrow"},[
          el("button",{class:"btn alt",text:"Popraw opis",onclick:ask}),
          el("button",{class:"btn",text:"Dodaj "+items.length+" "+plural(items.length,"pozycję","pozycje","pozycji"),onclick:commit})
        ]));
      });
    }
    function commit(){
      if(!live)return;
      live=false;
      var added=[];
      items.forEach(function(it,ix){
        added.push(pushEntry(dk,it.f,Math.max(1,Math.round(it.g*part)),sl,ix));
      });
      var savedSet=null;
      if(asSet&&items.length>1){
        savedSet={id:"s"+Date.now(),n:(setName||"Posiłek").trim(),items:added.map(function(e){
          return {fid:e.fid,n:e.n,g:e.g,k:e.k,p:e.p,c:e.c,f:e.f,u:e.u,s:e.s,sl:e.sl};
        })};
        S.sets.push(savedSet);
      }
      save();closeSheet();
      day=dk;render();
      toast("Dodano "+added.length+" "+plural(added.length,"pozycję","pozycje","pozycji")+" · "+fmt(total(part).k)+" kcal","Cofnij",function(){
        S.log[dk]=(S.log[dk]||[]).filter(function(e){return added.indexOf(e)<0});
        if(savedSet){var i=S.sets.indexOf(savedSet);if(i>-1)S.sets.splice(i,1)}
        save();render();
      });
    }
  }
}
function nlCard(){

/* ═══════════════════════ 10. render ═══════════════════════ */
var VIEWS={today:viewToday,add:viewAdd,meals:viewSets,me:viewMe};
var TABS=[["today","Dziś",ICON.today],["add","Dodaj",ICON.add],["meals","Zestawy",ICON.meals],["me","Ja",ICON.me]];
function go(v){view=v;render();window.scrollTo({top:0})}
function renderChrome(){
  var t=totals(day),left=S.goal.k-t.k;
  document.getElementById("brandSub").textContent=left>=0?fmt(left)+" kcal do celu":fmt(-left)+" kcal ponad";
}
function render(){
  var v=document.getElementById("view");
  v.innerHTML="";
  v.appendChild(VIEWS[view]());
  var tabs=document.getElementById("tabs");
  tabs.innerHTML="";
  TABS.forEach(function(t){
    var b=el("button",{class:"tab","aria-current":view===t[0]?"page":null,onclick:function(){go(t[0])}},[
      svg(t[2]),el("span",{text:t[1]})
    ]);
    tabs.appendChild(b);
  });
  renderChrome();
}
function applyTheme(){
  if(S.theme==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",S.theme);
}
document.getElementById("themeBtn").addEventListener("click",function(){
  var order=["auto","light","dark"],i=order.indexOf(S.theme);
  S.theme=order[(i+1)%3];applyTheme();save();
  toast("Motyw: "+({auto:"auto",light:"jasny",dark:"ciemny"}[S.theme]));
  if(view==="me")render();
});

/* uchwyt dla testów — parser bywa jedyną częścią, którą warto sprawdzić
   bez klikania po ekranach */
window.MAKRO={parse:parseMeal,alias:ALIAS,foods:allFoods,byId:byId,scale:scale,cats:CATS,tdee:tdeeReal,toast:toast,alko:alkoStats,unitLabel:unitLabel,week:function(){return weekBank(dkey(new Date()))},close:function(){return closeDay(dkey(new Date()))},wtFit:function(){return wtFit(WT_WINDOW)},dbg:{STOP:STOP,QUAL:QUAL}};

/* Offline. Rejestrujemy service workera tylko wtedy, gdy strona jest
   hostowana i ma manifest — wersja jednoplikowa (Artifact, file://) nie ma
   tych plików, więc nie ma czego rejestrować. */
/* Przeładowanie robimy tylko wtedy, gdy użytkownik o nie poprosił.
   Przy PIERWSZEJ instalacji clients.claim() też zmienia controllera, a wtedy
   przeładowanie jest niepotrzebnym mignięciem ekranu. */
var wantReload=false;
function updateBar(reg){
  if(document.getElementById("updbar"))return;
  var busy=false;
  var btn=el("button",{text:"Odśwież",onclick:function(){
    if(busy)return;
    busy=true;btn.setAttribute("disabled","");btn.textContent="Ładuję…";
    /* Nowa wersja wchodzi tylko na wyraźne życzenie; przeładowanie robimy,
       gdy faktycznie przejmie stronę, a nie „na wszelki wypadek”. */
    wantReload=true;
    if(reg.waiting)reg.waiting.postMessage({type:"skip"});
    else{location.reload();return}
    /* Gdyby zmiana controllera nie doszła (bywa na iOS), przeładuj i tak. */
    setTimeout(function(){if(wantReload)location.reload()},3000);
  }});
  var bar=el("div",{class:"update",id:"updbar",role:"status"},[
    el("span",{class:"tx",text:"Jest nowsza wersja apki"}),btn
  ]);
  document.body.appendChild(bar);
  document.body.classList.add("hasupd");
}
if("serviceWorker" in navigator
   && document.querySelector('link[rel="manifest"]')
   && window.isSecureContext){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      /* Nowa wersja czeka już teraz (użytkownik wrócił po wdrożeniu). */
      if(reg.waiting&&navigator.serviceWorker.controller)updateBar(reg);
      reg.addEventListener("updatefound",function(){
        var sw=reg.installing;
        if(!sw)return;
        sw.addEventListener("statechange",function(){
          /* Brak controllera = pierwsza instalacja, nie aktualizacja. */
          if(sw.state==="installed"&&navigator.serviceWorker.controller)updateBar(reg);
        });
      });
      /* Powrót do apki to najlepszy moment na sprawdzenie wdrożeń — bez tego
         zainstalowana apka może nie pytać o nic przez wiele godzin. */
      document.addEventListener("visibilitychange",function(){
        if(!document.hidden)reg.update().catch(function(){});
      });
    }).catch(function(){});
    var reloading=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(!wantReload||reloading)return;
      reloading=true;location.reload();
    });
  });
}

/* Apka odpalona z ekranu głównego to na iOS osobny worek danych niż Safari.
   Użytkownik tego nie wie i widzi pustą apkę zamiast swojego dnia. */
function isStandalone(){
  try{
    if(navigator.standalone===true)return true;
    return !!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
  }catch(e){return false}
}
function transferSheet(sn,n){
  openSheet(function(root){
    var at=new Date(sn.at||Date.now());
    root.appendChild(el("h3",{id:"sheetTitle",text:"Znalazłem Twoje dane"}));
    root.appendChild(el("div",{class:"per",text:
      "Ta apka jest tu pusta, ale w pamięci przeglądarki leży kopia: "+
      n+" "+plural(n,"wpis","wpisy","wpisów")+", ostatni zapis "+
      at.toLocaleDateString("pl-PL")+" o "+at.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"})+
      ". Na iOS apka z ekranu głównego ma osobną pamięć niż Safari — dlatego dzień wygląda na wyczyszczony."}));
    root.appendChild(el("div",{class:"sheetrow"},[
      el("button",{class:"btn alt",text:"Nie teraz",onclick:closeSheet}),
      el("button",{class:"btn",text:"Przenieś tutaj",onclick:function(){
        var r=sn.data||{};
        ["log","custom","sets","usage","goal","profile","theme","split","wt"].forEach(function(k){
          if(r[k]!=null)S[k]=r[k];
        });
        saveNow();applyTheme();closeSheet();day=dkey(new Date());render();
        toast("Przeniesione — "+n+" "+plural(n,"wpis","wpisy","wpisów"));
      }})
    ]));
  });
}
function safariHint(){
  var K=KEY+".hint";
  try{if(localStorage.getItem(K))return}catch(e){return}
  try{localStorage.setItem(K,"1")}catch(e){}
  openSheet(function(root){
    root.appendChild(el("h3",{id:"sheetTitle",text:"Dane zostały w Safari"}));
    root.appendChild(el("div",{class:"per",text:
      "iOS trzyma pamięć apki z ekranu głównego oddzielnie od Safari, więc to, "+
      "co zapisałeś w przeglądarce, nie przechodzi tu samo. Nic nie zginęło: "+
      "otwórz ten sam adres w Safari, wejdź w Ja → Kopia zapasowa → Kopiuj, "+
      "a potem wróć tutaj i wklej to w tym samym miejscu."}));
    root.appendChild(el("div",{class:"sheetrow"},[
      el("button",{class:"btn alt",text:"Rozumiem",onclick:closeSheet}),
      el("button",{class:"btn",text:"Otwórz kopię zapasową",onclick:function(){
        closeSheet();go("me");setTimeout(backupSheet,220);
      }})
    ]));
  });
}
function bootRescue(){
  if(loadFailed){
    toast("Poprzedni zapis był uszkodzony — odłożyłem go na bok, nie nadpisuję");
  }
  if(countEntries(S.log)>0)return;
  readSnapshot().then(function(sn){
    var n=sn&&sn.data&&sn.data.log?countEntries(sn.data.log):0;
    if(n>0){transferSheet(sn,n);return}
    if(isStandalone())safariHint();
  })["catch"](function(){});
}

load();
if(S.profile&&!S.goal.p)applySplit();
applyTheme();
day=dkey(new Date());
render();
bootRescue();
})();
